          throw "pkg-config could not resolve openssl libssl libcrypto"
        }
        $canonicalPkgConfigDir = [IO.Path]::GetFullPath((Join-Path $tripletRoot 'lib\pkgconfig')).TrimEnd('\')
        $canonicalPrefix = [IO.Path]::GetFullPath($tripletRoot).TrimEnd('\')
        foreach ($module in @('openssl', 'libssl', 'libcrypto')) {
          $pcFileDir = (& $pkgConfig.Source --variable=pcfiledir $module).Trim()
          if ($LASTEXITCODE -ne 0 -or [IO.Path]::GetFullPath($pcFileDir).TrimEnd('\') -ne $canonicalPkgConfigDir) {
            throw "$module escaped canonical pkg-config directory: $pcFileDir"
          }
          $prefix = (& $pkgConfig.Source --variable=prefix $module).Trim()
          if ($LASTEXITCODE -ne 0 -or [IO.Path]::GetFullPath($prefix).TrimEnd('\') -ne $canonicalPrefix) {
            throw "$module escaped canonical vcpkg prefix: $prefix"
          }
        }
        $opensslLibs = @(& $pkgConfig.Source --libs openssl) -join ' '
        if ($LASTEXITCODE -ne 0) {
          throw 'pkg-config --libs openssl failed'
        }
        $opensslTokens = @($opensslLibs -split '\s+' | Where-Object { $_ })
        if (($opensslTokens | Where-Object { $_ -ceq '-llibssl' }).Count -ne 1 -or
            ($opensslTokens | Where-Object { $_ -ceq '-llibcrypto' }).Count -ne 1 -or
            ($opensslTokens | Where-Object { $_ -ceq '-lssl' -or $_ -ceq '-lcrypto' }).Count -ne 0) {
          throw "unexpected OpenSSL linker tokens: $opensslLibs"
        }
        foreach ($leaf in @('libssl.lib', 'libcrypto.lib')) {
          $item = Get-Item -LiteralPath (Join-Path $tripletRoot "lib\$leaf") -Force -ErrorAction Stop
          if (-not $item.PSIsContainer -and ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -eq 0) {
            continue
          }
          throw "invalid OpenSSL library leaf: $($item.FullName)"
        }
    - name: Ensure vglyph revision
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        function Assert-NativeCommand($Message) {
          if ($LASTEXITCODE -ne 0) {
            throw $Message
          }
        }
        $expectedRevision = '${{ steps.vglyph.outputs.revision }}'
        $vglyphPath = Join-Path $env:VMODULES 'vglyph'
        if (Test-Path (Join-Path $vglyphPath '.git')) {
          $cachedRevision = (& git -C $vglyphPath rev-parse HEAD).Trim()
          Assert-NativeCommand "Could not inspect cached vglyph revision"
          if ($cachedRevision -ne $expectedRevision) {
            Write-Host "Cached vglyph revision $cachedRevision does not match expected $expectedRevision; rebuilding."
            Remove-Item -Recurse -Force $vglyphPath
          }
        } elseif (Test-Path $vglyphPath) {
          Remove-Item -Recurse -Force $vglyphPath
        }
        if (-not (Test-Path $vglyphPath)) {
          $vmodulesPath = Split-Path -Parent $vglyphPath
          New-Item -ItemType Directory -Force -Path $vmodulesPath | Out-Null
          git init $vglyphPath
          Assert-NativeCommand "git init vglyph failed"
          git -C $vglyphPath remote add origin '${{ env.VGLYPH_REPOSITORY }}'
          Assert-NativeCommand "git remote add vglyph failed"
          git -C $vglyphPath fetch --depth 1 origin $expectedRevision
          Assert-NativeCommand "git fetch vglyph failed"
          git -C $vglyphPath checkout --detach FETCH_HEAD
          Assert-NativeCommand "git checkout vglyph failed"
        }
        $resolvedRevision = (& git -C $vglyphPath rev-parse HEAD).Trim()
        Assert-NativeCommand "Could not inspect resolved vglyph revision"
        if ($resolvedRevision -ne $expectedRevision) {
          throw "Resolved vglyph revision $resolvedRevision does not match expected $expectedRevision"
        }
        Write-Host "Resolved vglyph revision: $resolvedRevision"
    - name: Checkout gui
      uses: actions/checkout@v4
      with:
        path: gui
    - name: Configure MSVC developer environment
      uses: ilammy/msvc-dev-cmd@v1
    - name: Run Windows setup preflight
      env:
        GUI_WINDOWS_PREFLIGHT_CC: msvc
      run: v run gui/_windows_preflight.vsh
    - name: Run noninteractive native tests
      run: >
        v -no-parallel -cc msvc test
        gui/_native_dialog_test.v
        gui/_native_print_test.v
        gui/_native_notification_test.v
        gui/nativebridge/_bridge_ex_test.v
        gui/nativebridge/_readback_abi_test.v
    - name: Compile native smoke examples
      run: |
        v -no-parallel -cc msvc -W -o dialogs_smoke.exe gui/examples/dialogs.v
        v -no-parallel -cc msvc -W -o printing_smoke.exe gui/examples/printing.v
        v -no-parallel -cc msvc -W -o notification_smoke.exe gui/examples/native_notification.v
        if ('${{ inputs.run_d3d11 }}' -eq 'true') {
          $d3dExamples = @(
            @{ Name = 'printing'; Path = 'gui/examples/printing.v'; Warn = $true },
            @{ Name = 'gradient_demo'; Path = 'gui/examples/gradient_demo.v'; Warn = $true },
            @{ Name = 'shadow_demo'; Path = 'gui/examples/shadow_demo.v'; Warn = $true },
            @{ Name = 'blur_demo'; Path = 'gui/examples/blur_demo.v'; Warn = $true },
            @{ Name = 'image_clip'; Path = 'gui/examples/image_clip.v'; Warn = $true },
            @{ Name = 'svg_demo'; Path = 'gui/examples/svg_demo.v'; Warn = $true },
            @{ Name = 'custom_shader'; Path = 'gui/examples/custom_shader.v'; Warn = $true },
            @{ Name = 'showcase'; Path = 'gui/examples/showcase.v'; Warn = $false }
          )
          foreach ($example in $d3dExamples) {
            $args = @('-no-parallel', '-cc', 'msvc', '-d', 'sokol_d3d11')
            if ($example.Warn) {
              $args += '-W'
            }
            $args += @('-o', "$($example.Name)_d3d11_smoke.exe", $example.Path)
            v @args
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
        }

  clang:
    name: Clang native smoke
    runs-on: windows-latest
    timeout-minutes: 120
    if: ${{ !inputs.prewarm_deps_only }}
    steps:
    - name: Resolve V revision
      id: v
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $revision = '${{ env.V_REVISION }}'
        if ($revision -notmatch '^[0-9a-f]{40}$') {
          throw "V revision is not an exact 40-hex SHA: $revision"
        }
        Write-Host "V revision: $revision"
        "revision=$revision" | Add-Content -Path $env:GITHUB_OUTPUT
    - name: Restore V compiler cache
      id: restore-v-cache
      uses: actions/cache/restore@v4
      with:
        path: v
        key: windows-v-compiler-${{ steps.v.outputs.revision }}-v1
    - name: Install V
      id: install-v
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        function Assert-NativeCommand($Message) {
          if ($LASTEXITCODE -ne 0) {
            throw $Message
          }
        }
        $expectedRevision = '${{ steps.v.outputs.revision }}'
        if (Test-Path .\v\v.exe) {
          $cachedRevision = ( & git -C v rev-parse HEAD).Trim()
          Assert-NativeCommand "Could not inspect cached V revision"
          if ($cachedRevision -ne $expectedRevision) {
            Write-Host "Cached V revision $cachedRevision does not match expected $expectedRevision; rebuilding."
            Remove-Item -Recurse -Force .\v
          }
        }
        if (-not (Test-Path .\v\v.exe)) {
          if (Test-Path .\v) {
            Remove-Item -Recurse -Force .\v
          }
          git init v
          Assert-NativeCommand "git init failed"
          git -C v remote add origin '${{ env.V_REPOSITORY }}'
          Assert-NativeCommand "git remote add failed"
          git -C v fetch --depth 1 origin $expectedRevision
          Assert-NativeCommand "git fetch failed"
          git -C v checkout --detach FETCH_HEAD
          Assert-NativeCommand "git checkout failed"
          Push-Location v
          cmd /c makev.bat
          if ($LASTEXITCODE -ne 0) {
            throw "makev.bat failed"
          }
          Pop-Location
        }
        $vPath = (Resolve-Path .\v).Path
        Add-Content -Path $env:GITHUB_PATH -Value $vPath
        $version = ( & .\v\v.exe version).Trim()
        $revision = ( & git -C v rev-parse HEAD).Trim()
        Assert-NativeCommand "Could not inspect V revision"
        if ($revision -ne $expectedRevision) {
          throw "Installed V revision $revision does not match expected $expectedRevision"
        }
        Write-Host "Resolved V revision: $revision"
        "version=$version" | Add-Content -Path $env:GITHUB_OUTPUT
        "revision=$revision" | Add-Content -Path $env:GITHUB_OUTPUT
    - name: Log V version
      run: v version
    - name: Save V compiler cache
      if: ${{ steps.restore-v-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: v
        key: ${{ steps.restore-v-cache.outputs.cache-primary-key }}
    - name: Resolve vglyph revision
      id: vglyph
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $revision = '${{ env.VGLYPH_REVISION }}'
        if ($revision -notmatch '^[0-9a-f]{40}$') {
          throw "vglyph revision is not an exact 40-hex SHA: $revision"
        }
        Write-Host "vglyph revision: $revision"
        "revision=$revision" | Add-Content -Path $env:GITHUB_OUTPUT
    - name: Resolve vcpkg revision
      id: vcpkg
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $vcpkgExe = (Get-Command vcpkg -ErrorAction Stop).Source
        $vcpkgRoot = if ($env:VCPKG_ROOT) { $env:VCPKG_ROOT } else { Split-Path -Parent $vcpkgExe }
        $revision = (& git -C $vcpkgRoot rev-parse HEAD).Trim()
        if ($LASTEXITCODE -ne 0 -or $revision -notmatch '^[0-9a-f]{40}$') {
          throw "Could not resolve the vcpkg checkout revision at $vcpkgRoot"
        }
        $schema = '${{ env.VCPKG_CACHE_SCHEMA }}'
        $triplet = '${{ env.VCPKG_TARGET_TRIPLET }}'
        $packages = '${{ env.VCPKG_PACKAGES }}'
        if ($schema -notmatch '^[A-Za-z0-9._-]+$' -or $triplet -notmatch '^[A-Za-z0-9._-]+$' -or $packages -notmatch '^[a-z0-9+._-]+(?:,[a-z0-9+._-]+)*$') {
          throw 'Invalid vcpkg cache input'
        }
        $cacheInputs = "schema=$schema;triplet=$triplet;packages=$packages"
        $sha256 = [System.Security.Cryptography.SHA256]::Create()
        try {
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($cacheInputs)
          $inputsDigest = ([System.BitConverter]::ToString($sha256.ComputeHash($bytes))).Replace('-', '').ToLowerInvariant()
        } finally {
          $sha256.Dispose()
        }
        & $vcpkgExe version
        Write-Host "vcpkg revision: $revision"
        Write-Host "vcpkg cache inputs: $cacheInputs"
        Write-Host "vcpkg cache inputs SHA-256: $inputsDigest"
        "revision=$revision" | Add-Content -Path $env:GITHUB_OUTPUT
        "inputs_digest=$inputsDigest" | Add-Content -Path $env:GITHUB_OUTPUT
        "triplet=$triplet" | Add-Content -Path $env:GITHUB_OUTPUT
    - name: Restore vcpkg binary cache
      id: restore-vcpkg-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.VCPKG_BINARY_CACHE }}
        key: windows-vcpkg-${{ steps.vcpkg.outputs.triplet }}-${{ steps.vcpkg.outputs.revision }}-${{ steps.vcpkg.outputs.inputs_digest }}
        restore-keys: |
          windows-vcpkg-${{ steps.vcpkg.outputs.triplet }}-${{ steps.vcpkg.outputs.revision }}-
    - name: Restore V module cache
      uses: actions/cache@v4
      with:
        path: ${{ env.VMODULES }}\vglyph
        key: windows-vmodules-vglyph-${{ steps.install-v.outputs.revision }}-${{ steps.vglyph.outputs.revision }}-v2
        restore-keys: |
          windows-vmodules-vglyph-${{ steps.install-v.outputs.revision }}-
          windows-vmodules-vglyph-
    - name: Install pango, freetype, and OpenSSL
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        New-Item -ItemType Directory -Force -Path "$env:VCPKG_BINARY_CACHE" | Out-Null
        $triplet = '${{ env.VCPKG_TARGET_TRIPLET }}'
        $packageSpecs = @('${{ env.VCPKG_PACKAGES }}'.Split(',') | ForEach-Object { "$($_):$triplet" })
        vcpkg install @packageSpecs
        if ($LASTEXITCODE -ne 0) {
          throw "vcpkg install failed"
        }
    - name: Save vcpkg binary cache
      if: ${{ steps.restore-vcpkg-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: ${{ env.VCPKG_BINARY_CACHE }}
        key: ${{ steps.restore-vcpkg-cache.outputs.cache-primary-key }}
    - name: Expose vcpkg pkg-config paths
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $triplet = '${{ env.VCPKG_TARGET_TRIPLET }}'
        $vcpkgExe = (Get-Command vcpkg -ErrorAction Stop).Source
        $roots = @()
        if ($vcpkgExe) {
          $roots += Split-Path -Parent $vcpkgExe
        }
        if ($env:VCPKG_ROOT) {
          $roots += $env:VCPKG_ROOT
        }
        $vcpkgRoot = $null
        foreach ($root in ($roots | Select-Object -Unique)) {
          if (Test-Path (Join-Path $root "installed\$triplet")) {
            $vcpkgRoot = $root
            break
          }
        }
        if (-not $vcpkgRoot) {
          throw "Could not find vcpkg installed\$triplet from vcpkg.exe or VCPKG_ROOT"
        }
        $tripletRoot = Join-Path $vcpkgRoot "installed\$triplet"
        $pkgConfigDirs = @(
          (Join-Path $tripletRoot 'lib\pkgconfig'),
          (Join-Path $tripletRoot 'share\pkgconfig')
        ) | Where-Object { Test-Path $_ }
        if ($pkgConfigDirs.Count -eq 0) {
          throw "No pkgconfig directories found under $tripletRoot"
        }
        $pkgConfigPath = $pkgConfigDirs -join ';'
        "PKG_CONFIG_PATH=$pkgConfigPath" | Add-Content -Path $env:GITHUB_ENV
        $env:PKG_CONFIG_PATH = $pkgConfigPath
        $pathEntries = @()
        $binDir = Join-Path $tripletRoot 'bin'
        if (Test-Path $binDir) {
          $pathEntries += $binDir
        }
        $pkgconfDir = Join-Path $tripletRoot 'tools\pkgconf'
        if (Test-Path $pkgconfDir) {
          $pathEntries += $pkgconfDir
        }
        foreach ($entry in $pathEntries) {
          $entry | Add-Content -Path $env:GITHUB_PATH
        }
        if ($pathEntries.Count -gt 0) {
          $env:PATH = ($pathEntries + $env:PATH) -join ';'
        }
        if (-not (Get-Command pkg-config -ErrorAction SilentlyContinue)) {
          $pkgconf = Get-Command pkgconf -ErrorAction SilentlyContinue
          if ($pkgconf) {
            $shimDir = Join-Path $env:RUNNER_TEMP 'pkg-config-shim'
            New-Item -ItemType Directory -Force -Path $shimDir | Out-Null
            Set-Content -Path (Join-Path $shimDir 'pkg-config.cmd') -Encoding ascii -Value @(
              '@echo off',
              '"' + $pkgconf.Source + '" %*'
            )
            $shimDir | Add-Content -Path $env:GITHUB_PATH
            $env:PATH = "$shimDir;$env:PATH"
          }
        }
        $pkgConfig = Get-Command pkg-config -ErrorAction Stop
        & $pkgConfig.Source --exists freetype2 pango pangoft2
        if ($LASTEXITCODE -ne 0) {
          throw "pkg-config could not resolve freetype2 pango pangoft2"
        }
        & $pkgConfig.Source --exists openssl libssl libcrypto
        if ($LASTEXITCODE -ne 0) {
          throw "pkg-config could not resolve openssl libssl libcrypto"
        }
        $canonicalPkgConfigDir = [IO.Path]::GetFullPath((Join-Path $tripletRoot 'lib\pkgconfig')).TrimEnd('\')
        $canonicalPrefix = [IO.Path]::GetFullPath($tripletRoot).TrimEnd('\')
        foreach ($module in @('openssl', 'libssl', 'libcrypto')) {
          $pcFileDir = (& $pkgConfig.Source --variable=pcfiledir $module).Trim()
          if ($LASTEXITCODE -ne 0 -or [IO.Path]::GetFullPath($pcFileDir).TrimEnd('\') -ne $canonicalPkgConfigDir) {
            throw "$module escaped canonical pkg-config directory: $pcFileDir"
          }
          $prefix = (& $pkgConfig.Source --variable=prefix $module).Trim()
          if ($LASTEXITCODE -ne 0 -or [IO.Path]::GetFullPath($prefix).TrimEnd('\') -ne $canonicalPrefix) {
            throw "$module escaped canonical vcpkg prefix: $prefix"
          }
        }
        if ($null -ne $env:CFLAGS -and $env:CFLAGS.Length -ne 0) {
          throw 'ambient CFLAGS must be empty before exporting the canonical GLib config include'
        }
        $glibLibDirLines = @(& $pkgConfig.Source --variable=libdir glib-2.0)
        if ($LASTEXITCODE -ne 0 -or $glibLibDirLines.Count -ne 1) {
          throw 'pkg-config --variable=libdir glib-2.0 failed or returned multiple lines'
        }
        $glibLibDirRaw = [string]$glibLibDirLines[0]
        if ([string]::IsNullOrWhiteSpace($glibLibDirRaw)) {
          throw 'pkg-config --variable=libdir glib-2.0 failed or returned an empty value'
        }
        if ($glibLibDirRaw -match '[\r\n]') {
          throw 'GLib libdir contains a forbidden line break'
        }
        $canonicalLibDir = [IO.Path]::GetFullPath((Join-Path $tripletRoot 'lib')).TrimEnd('\')
        $glibLibDir = [IO.Path]::GetFullPath($glibLibDirRaw.Trim()).TrimEnd('\')
        if (-not [string]::Equals($glibLibDir, $canonicalLibDir, [System.StringComparison]::OrdinalIgnoreCase)) {
          throw "GLib libdir escaped canonical vcpkg lib directory: $glibLibDir"
        }
        $glibConfigIncludeDir = [IO.Path]::GetFullPath((Join-Path $glibLibDir 'glib-2.0\include')).TrimEnd('\')
        $glibConfigIncludeItem = Get-Item -LiteralPath $glibConfigIncludeDir -Force -ErrorAction Stop
        if (-not $glibConfigIncludeItem.PSIsContainer -or
            ($glibConfigIncludeItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
          throw "invalid GLib config include directory: $glibConfigIncludeDir"
        }
        $glibConfigHeader = Get-Item -LiteralPath (Join-Path $glibConfigIncludeDir 'glibconfig.h') -Force -ErrorAction Stop
        if ($glibConfigHeader.PSIsContainer -or
            ($glibConfigHeader.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
          throw "invalid GLib config header: $($glibConfigHeader.FullName)"
        }
        $glibConfigCflags = '-I"{0}"' -f $glibConfigIncludeDir
        $env:CFLAGS = $glibConfigCflags
        "CFLAGS=$glibConfigCflags" | Add-Content -Path $env:GITHUB_ENV
        $opensslLibs = @(& $pkgConfig.Source --libs openssl) -join ' '
        if ($LASTEXITCODE -ne 0) {
          throw 'pkg-config --libs openssl failed'
        }
        $opensslTokens = @($opensslLibs -split '\s+' | Where-Object { $_ })
        if (($opensslTokens | Where-Object { $_ -ceq '-llibssl' }).Count -ne 1 -or
            ($opensslTokens | Where-Object { $_ -ceq '-llibcrypto' }).Count -ne 1 -or
            ($opensslTokens | Where-Object { $_ -ceq '-lssl' -or $_ -ceq '-lcrypto' }).Count -ne 0) {
          throw "unexpected OpenSSL linker tokens: $opensslLibs"
        }
        foreach ($leaf in @('libssl.lib', 'libcrypto.lib')) {
          $item = Get-Item -LiteralPath (Join-Path $tripletRoot "lib\$leaf") -Force -ErrorAction Stop
          if (-not $item.PSIsContainer -and ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -eq 0) {
            continue
          }
          throw "invalid OpenSSL library leaf: $($item.FullName)"
        }
    - name: Ensure vglyph revision
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        function Assert-NativeCommand($Message) {
          if ($LASTEXITCODE -ne 0) {
            throw $Message
          }
        }
        $expectedRevision = '${{ steps.vglyph.outputs.revision }}'
        $vglyphPath = Join-Path $env:VMODULES 'vglyph'
        if (Test-Path (Join-Path $vglyphPath '.git')) {
          $cachedRevision = (& git -C $vglyphPath rev-parse HEAD).Trim()
          Assert-NativeCommand "Could not inspect cached vglyph revision"
          if ($cachedRevision -ne $expectedRevision) {
            Write-Host "Cached vglyph revision $cachedRevision does not match expected $expectedRevision; rebuilding."
            Remove-Item -Recurse -Force $vglyphPath
          }
        } elseif (Test-Path $vglyphPath) {
          Remove-Item -Recurse -Force $vglyphPath
        }
        if (-not (Test-Path $vglyphPath)) {
          $vmodulesPath = Split-Path -Parent $vglyphPath
          New-Item -ItemType Directory -Force -Path $vmodulesPath | Out-Null
          git init $vglyphPath
          Assert-NativeCommand "git init vglyph failed"
          git -C $vglyphPath remote add origin '${{ env.VGLYPH_REPOSITORY }}'
          Assert-NativeCommand "git remote add vglyph failed"
          git -C $vglyphPath fetch --depth 1 origin $expectedRevision
          Assert-NativeCommand "git fetch vglyph failed"
          git -C $vglyphPath checkout --detach FETCH_HEAD
          Assert-NativeCommand "git checkout vglyph failed"
        }
        $resolvedRevision = (& git -C $vglyphPath rev-parse HEAD).Trim()
        Assert-NativeCommand "Could not inspect resolved vglyph revision"
        if ($resolvedRevision -ne $expectedRevision) {
          throw "Resolved vglyph revision $resolvedRevision does not match expected $expectedRevision"
        }
        Write-Host "Resolved vglyph revision: $resolvedRevision"
    - name: Validate existing vglyph checkout
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $vglyphPath = Join-Path $env:VMODULES 'vglyph'
        if (-not (Test-Path -LiteralPath $vglyphPath -PathType Container) -or
            -not (Test-Path -LiteralPath (Join-Path $vglyphPath '.git')) -or
            -not (Test-Path -LiteralPath (Join-Path $vglyphPath 'v.mod') -PathType Leaf)) {
          throw "Pinned vglyph checkout is incomplete: $vglyphPath"
        }
        $resolvedRevision = (& git -C $vglyphPath rev-parse HEAD).Trim()
        if ($LASTEXITCODE -ne 0 -or $resolvedRevision -ne '${{ env.VGLYPH_REVISION }}') {
          throw "Pinned vglyph revision mismatch: $resolvedRevision"
        }
        $status = @(& git -C $vglyphPath status --porcelain=v1 --untracked-files=all)
        if ($LASTEXITCODE -ne 0 -or $status.Count -ne 0) {
          throw "Pinned vglyph checkout is not clean: $($status -join '; ')"
        }
    - name: Checkout gui
      uses: actions/checkout@v4
      with:
        path: gui
    - name: Run Windows setup preflight
      env:
        GUI_WINDOWS_PREFLIGHT_CC: clang
      run: v run gui/_windows_preflight.vsh
    - name: Run noninteractive native tests
      env:
        ISSUE74_DIAG_NATIVE: '1'
      run: |
        $ErrorActionPreference = 'Stop'
        if ([string]::IsNullOrEmpty($env:ISSUE74_DIAG_NATIVE)) {
          v -no-parallel -cc clang test gui/_native_dialog_test.v gui/_native_print_test.v gui/_native_notification_test.v gui/nativebridge/_bridge_ex_test.v gui/nativebridge/_readback_abi_test.v
          exit $LASTEXITCODE
        }
        if ($env:ISSUE74_DIAG_NATIVE -cne '1') {
          throw "Unsupported ISSUE74_DIAG_NATIVE value: $env:ISSUE74_DIAG_NATIVE"
        }
        $PSNativeCommandUseErrorActionPreference = $false
        function Format-RcHex([int]$Value) {
          try {
            $bits = [BitConverter]::ToUInt32([BitConverter]::GetBytes([int32]$Value), 0)
            return ('0x{0:X8}' -f $bits)
          } catch {
            return 'unavailable'
          }
        }
        & v -no-parallel -cc clang test gui/_native_dialog_test.v gui/_native_print_test.v gui/_native_notification_test.v gui/nativebridge/_bridge_ex_test.v gui/nativebridge/_readback_abi_test.v
        $primaryRc = $LASTEXITCODE
        Write-Host "Primary native batch rc=$primaryRc hex=$(Format-RcHex $primaryRc)"
        if ($primaryRc -eq 0) {
          exit 0
        }
        function Write-BoundedDiagnostic([string]$Path, [string]$Label) {
          try {
            $item = Get-Item -LiteralPath $Path -Force -ErrorAction Stop
            if (-not ($item -is [IO.FileInfo]) -or
                ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
                $item.Length -gt 1048576) {
              throw "untrusted or oversized diagnostic stream"
            }
            $lines = @(Get-Content -LiteralPath $item.FullName -ErrorAction Stop)
            Write-Host "ISSUE74_STREAM label=$Label bytes=$($item.Length) lines=$($lines.Count)"
            foreach ($line in @($lines | Select-Object -First 160)) {
              $text = [string]$line
              if ($text.Length -gt 1024) { $text = $text.Substring(0, 1024) + '<truncated>' }
              Write-Host $text
            }
            if ($lines.Count -gt 160) { Write-Warning "$Label output truncated at 160 lines" }
            return $lines
          } catch {
            Write-Warning "Cannot read bounded $Label output: $($_.Exception.Message)"
            return @()
          }
        }
        function Write-CFunctionSnippet([string[]]$Lines, [string]$Pattern, [string]$Label) {
          $matchIndexes = @()
          for ($lineIndex = 0; $lineIndex -lt $Lines.Count; $lineIndex++) {
            if ($Lines[$lineIndex] -match $Pattern) { $matchIndexes += $lineIndex }
          }
          Write-Host "ISSUE74_C_MATCH label=$Label count=$($matchIndexes.Count)"
          foreach ($matchIndex in @($matchIndexes | Select-Object -First 2)) {
            $lastIndex = [Math]::Min($Lines.Count - 1, $matchIndex + 11)
            for ($lineIndex = $matchIndex; $lineIndex -le $lastIndex; $lineIndex++) {
              $text = [string]$Lines[$lineIndex]
              if ($text.Length -gt 1024) { $text = $text.Substring(0, 1024) + '<truncated>' }
              Write-Host ("ISSUE74_C {0}:{1}: {2}" -f $Label, ($lineIndex + 1), $text)
            }
          }
        }
        function Get-LlvmDiagnosticTools() {
          try {
            $clangCommand = Get-Command clang.exe -CommandType Application -ErrorAction Stop
            $readobjCommand = Get-Command llvm-readobj.exe -CommandType Application -ErrorAction Stop
            $clangItem = Get-Item -LiteralPath $clangCommand.Source -Force
            $readobjItem = Get-Item -LiteralPath $readobjCommand.Source -Force
            $llvmBin = [IO.Path]::GetFullPath((Join-Path $env:ProgramFiles 'LLVM\bin')).TrimEnd('\')
            foreach ($toolItem in @($clangItem, $readobjItem)) {
              if (-not ($toolItem -is [IO.FileInfo]) -or
                  ($toolItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
                  -not [string]::Equals([IO.Path]::GetFullPath($toolItem.DirectoryName).TrimEnd('\'), $llvmBin, [StringComparison]::OrdinalIgnoreCase)) {
                throw "LLVM diagnostic tool escaped canonical LLVM bin: $($toolItem.FullName)"
              }
            }
            $clangVersion = @(& $clangItem.FullName --version 2>&1)
            $clangVersionRc = $LASTEXITCODE
            $readobjVersion = @(& $readobjItem.FullName --version 2>&1)
            $readobjVersionRc = $LASTEXITCODE
            $clangTarget = @(& $clangItem.FullName -dumpmachine 2>&1)
            $clangTargetRc = $LASTEXITCODE
            $clangText = $clangVersion -join "`n"
            $readobjText = $readobjVersion -join "`n"
            if ($clangVersionRc -ne 0 -or $readobjVersionRc -ne 0 -or $clangTargetRc -ne 0 -or
                $clangText -notmatch '(?m)^\s*clang version ([0-9]+)\.' -or
                $readobjText -notmatch '(?m)^\s*LLVM version ([0-9]+)\.') {
              throw 'LLVM diagnostic provenance failed'
            }
            $clangMajor = [int]([regex]::Match($clangText, '(?m)^\s*clang version ([0-9]+)\.').Groups[1].Value)
            $readobjMajor = [int]([regex]::Match($readobjText, '(?m)^\s*LLVM version ([0-9]+)\.').Groups[1].Value)
            $targetText = ($clangTarget -join '').Trim()
            if ($clangMajor -ne $readobjMajor -or $targetText -notmatch '^(x86_64|amd64)-.*windows') {
              throw "LLVM version or target mismatch: clang=$clangMajor readobj=$readobjMajor target=$targetText"
            }
            Write-Host "ISSUE74_LLVM clang=$($clangItem.FullName) readobj=$($readobjItem.FullName) major=$clangMajor target=$targetText"
            return @{ Clang = $clangItem; ClangMajor = $clangMajor; Readobj = $readobjItem }
          } catch {
            Write-Warning "LLVM diagnostic provenance unavailable: $($_.Exception.Message)"
            return $null
          }
        }
        function Invoke-BoundedProcess([string]$FilePath, [string[]]$ArgumentList, [string]$WorkingDirectory, [string]$Prefix) {
          $stdinPath = "$Prefix.stdin.txt"
          $stdoutPath = "$Prefix.stdout.txt"
          $stderrPath = "$Prefix.stderr.txt"
          foreach ($path in @($stdinPath, $stdoutPath, $stderrPath)) {
            if (Test-Path -LiteralPath $path) { throw "Fresh process stream path already exists: $path" }
          }
          [IO.File]::WriteAllBytes($stdinPath, [byte[]]@())
          $process = Start-Process -FilePath $FilePath -ArgumentList $ArgumentList -WorkingDirectory $WorkingDirectory -NoNewWindow -PassThru -RedirectStandardInput $stdinPath -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath
          $completed = $process.WaitForExit(30000)
          if (-not $completed) {
            try { $process.Kill($true) } catch { Write-Warning "ISSUE74_PROCESS kill warning: $($_.Exception.Message)" }
            [void]$process.WaitForExit(5000)
            return @{ Rc = $null; Hex = 'timeout'; Stdout = $stdoutPath; Stderr = $stderrPath }
          }
          $process.WaitForExit()
          $processRc = $process.ExitCode
          return @{ Rc = $processRc; Hex = (Format-RcHex $processRc); Stdout = $stdoutPath; Stderr = $stderrPath }
        }
        function Get-LldbDiagnosticTool([string]$WorkingDirectory, [string]$PrefixRoot) {
          try {
            $clangCommand = Get-Command clang.exe -CommandType Application -ErrorAction Stop
            $lldbCommand = Get-Command lldb.exe -CommandType Application -ErrorAction Stop
            $clangItem = Get-Item -LiteralPath $clangCommand.Source -Force
            $lldbItem = Get-Item -LiteralPath $lldbCommand.Source -Force
            $llvmBin = [IO.Path]::GetFullPath((Join-Path $env:ProgramFiles 'LLVM\bin')).TrimEnd('\')
            foreach ($toolItem in @($clangItem, $lldbItem)) {
              if (-not ($toolItem -is [IO.FileInfo]) -or ($toolItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
                  -not [string]::Equals([IO.Path]::GetFullPath($toolItem.DirectoryName).TrimEnd('\'), $llvmBin, [StringComparison]::OrdinalIgnoreCase)) {
                throw "LLDB diagnostic tool escaped canonical LLVM bin: $($toolItem.FullName)"
              }
            }
            Write-Host "ISSUE74_LLDB_PATH path=$($lldbItem.FullName)"
            $lldbVersionPrefix = Join-Path $PrefixRoot 'lldb-version-flag'
            $lldbVersion = $null
            $lldbVersionLines = @()
            try {
              $lldbVersion = Invoke-BoundedProcess -FilePath $lldbItem.FullName -ArgumentList ([string[]]@('--version')) -WorkingDirectory $WorkingDirectory -Prefix $lldbVersionPrefix
              Write-Host "ISSUE74_LLDB_VERSION_FLAG rc=$($lldbVersion.Rc) hex=$($lldbVersion.Hex)"
              $lldbVersionLines += @(Write-BoundedDiagnostic $lldbVersion.Stdout 'lldb-version-flag-stdout')
              $lldbVersionLines += @(Write-BoundedDiagnostic $lldbVersion.Stderr 'lldb-version-flag-stderr')
            } catch {
              Write-Warning "LLDB --version probe unavailable: $($_.Exception.Message)"
            }
            $lldbVersionMatches = @($lldbVersionLines | ForEach-Object {
              [regex]::Match($_.Trim(), '^lldb version ([0-9]+)(?:\.[0-9]+)+(?:git)?(?: \([^()\r\n]+\))?$')
            } | Where-Object { $_.Success })
            if ($null -eq $lldbVersion -or $lldbVersion.Rc -ne 0 -or $lldbVersionMatches.Count -ne 1) {
              $lldbFallbackPrefix = Join-Path $PrefixRoot 'lldb-version-command'
              $lldbVersion = $null
              $lldbVersionLines = @()
              try {
                $lldbVersion = Invoke-BoundedProcess -FilePath $lldbItem.FullName -ArgumentList ([string[]]@('--no-lldbinit', '--no-use-colors', '--batch', '-o', 'version', '-o', 'quit')) -WorkingDirectory $WorkingDirectory -Prefix $lldbFallbackPrefix
                Write-Host "ISSUE74_LLDB_VERSION_COMMAND rc=$($lldbVersion.Rc) hex=$($lldbVersion.Hex)"
                $lldbVersionLines += @(Write-BoundedDiagnostic $lldbVersion.Stdout 'lldb-version-command-stdout')
                $lldbVersionLines += @(Write-BoundedDiagnostic $lldbVersion.Stderr 'lldb-version-command-stderr')
              } catch {
                Write-Warning "LLDB command version probe unavailable: $($_.Exception.Message)"
              }
              $lldbVersionMatches = @($lldbVersionLines | ForEach-Object {
                [regex]::Match($_.Trim(), '^lldb version ([0-9]+)(?:\.[0-9]+)+(?:git)?(?: \([^()\r\n]+\))?$')
              } | Where-Object { $_.Success })
            }
            if ($null -eq $lldbVersion -or $lldbVersion.Rc -ne 0 -or $lldbVersionMatches.Count -ne 1) { throw 'LLDB version provenance failed' }
            $lldbMajor = [int]$lldbVersionMatches[0].Groups[1].Value
            $clangVersion = @(& $clangItem.FullName --version 2>&1)
            $clangVersionRc = $LASTEXITCODE
            $clangText = $clangVersion -join "`n"
            if ($clangVersionRc -ne 0 -or $clangText -notmatch '(?m)^\s*clang version ([0-9]+)\.') { throw 'Clang version provenance failed for LLDB' }
            $clangMajor = [int]([regex]::Match($clangText, '(?m)^\s*clang version ([0-9]+)\.').Groups[1].Value)
            if ($lldbMajor -ne $clangMajor) { throw "LLDB/Clang major mismatch: lldb=$lldbMajor clang=$clangMajor" }
            Write-Host "ISSUE74_LLDB path=$($lldbItem.FullName) major=$lldbMajor"
            return $lldbItem
          } catch {
            Write-Warning "LLDB diagnostic provenance unavailable: $($_.Exception.Message)"
            return $null
          }
        }

        $llvmAttempted = $false
        $llvmTools = $null

        $generations = @(
          @{ Name = 'v1'; Args = @('-old-compiler') }
        )
        $probes = @(
          @{ Name = 'control'; File = 'gui/_native_dialog_test.v'; Function = 'test_nativebridge_module_loads'; Expected = 1; CName = 'gui__test_nativebridge_module_loads' },
          @{ Name = 'empty'; File = 'gui/nativebridge/_bridge_ex_test.v'; Function = '__issue74_literal_absent_ntests0__'; Expected = 0; CName = '' },
          @{ Name = 'selected'; File = 'gui/nativebridge/_bridge_ex_test.v'; Function = 'test_bridge_result_ex_from_legacy_ok'; Expected = 1; CName = 'nativebridge__test_bridge_result_ex_from_legacy_ok' }
        )
        $observations = @{}
        foreach ($generation in $generations) {
          foreach ($probe in $probes) {
            $key = "$($generation.Name)-$($probe.Name)"
            try {
              $ownerTemp = Join-Path $env:RUNNER_TEMP "issue74-host-clang-$key"
              if (Test-Path -LiteralPath $ownerTemp) { throw "Fresh VTMP already exists: $ownerTemp" }
              New-Item -ItemType Directory -Path $ownerTemp | Out-Null
              $ownerTempItem = Get-Item -LiteralPath $ownerTemp -Force
              if (-not $ownerTempItem.PSIsContainer -or ($ownerTempItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                throw "VTMP is not a real directory: $ownerTemp"
              }
              $ownerExe = Join-Path $ownerTempItem.FullName 'owner.exe'
              if (Test-Path -LiteralPath $ownerExe) { throw "Fresh owner PE already exists: $ownerExe" }
              $env:VTMP = $ownerTempItem.FullName
              $diagStdout = Join-Path $ownerTempItem.FullName 'diagnostic.stdout.txt'
              $diagStderr = Join-Path $ownerTempItem.FullName 'diagnostic.stderr.txt'
              $compilerArgs = @($generation.Args)
              & v @compilerArgs -no-parallel -cc clang -no-retry-compilation -showcc -keepc -o $ownerExe -test-runner dump -run-only $probe.Function run $probe.File 1> $diagStdout 2> $diagStderr
              $diagnosticRc = $LASTEXITCODE
              $stdoutLines = @(Write-BoundedDiagnostic $diagStdout "$key-stdout")
              $stderrLines = @(Write-BoundedDiagnostic $diagStderr "$key-stderr")
              $combinedLines = @($stdoutLines + $stderrLines)
              $startLines = @($combinedLines | Where-Object { $_ -match '^> main\.DumpTestRunner\.start \| ntests: ([0-9]+)$' })
              $startValues = @($startLines | ForEach-Object { [int]([regex]::Match($_, '^> main\.DumpTestRunner\.start \| ntests: ([0-9]+)$').Groups[1].Value) })
              $fnStartLines = @($combinedLines | Where-Object { $_ -ceq '> main.DumpTestRunner.fn_start' })
              $fnPassLines = @($combinedLines | Where-Object { $_ -match '^> main\.DumpTestRunner\.fn_pass OK [0-9]+ - .+$' })
              $fnFailLines = @($combinedLines | Where-Object { $_ -match '^> main\.DumpTestRunner\.fn_fail NOT OK [0-9]+ - .+$' })
              $finishLines = @($combinedLines | Where-Object { $_ -match '^> main\.DumpTestRunner\.finish , [0-9]+ tests, [0-9]+ assertions, [0-9]+ failures$' })
              $exitLines = @($combinedLines | Where-Object { $_ -ceq '> main.DumpTestRunner.exit_code' })
              $markers = @($startLines + $fnStartLines + $fnPassLines + $fnFailLines + $finishLines + $exitLines)
              $markerContract = $startLines.Count -eq 1 -and $startValues.Count -eq 1 -and $startValues[0] -eq [int]$probe.Expected
              if ([int]$probe.Expected -eq 0) {
                $markerContract = $markerContract -and $fnStartLines.Count -eq 0 -and $fnPassLines.Count -eq 0 -and
                  $fnFailLines.Count -eq 0 -and $finishLines.Count -eq 1 -and $exitLines.Count -eq 1
              } else {
                $markerContract = $markerContract -and $fnStartLines.Count -eq 1 -and $fnPassLines.Count -le 1 -and
                  $fnFailLines.Count -le 1 -and ($fnPassLines.Count + $fnFailLines.Count) -le 1
                if ($diagnosticRc -eq 0) {
                  $markerContract = $markerContract -and $fnPassLines.Count -eq 1 -and $fnFailLines.Count -eq 0 -and
                    $finishLines.Count -eq 1 -and $exitLines.Count -eq 1
                } elseif ($fnFailLines.Count -eq 1) {
                  $markerContract = $markerContract -and $fnPassLines.Count -eq 0
                }
              }
              Write-Host "ISSUE74_PROBE generation=$($generation.Name) probe=$($probe.Name) expected_tests=$($probe.Expected) rc=$diagnosticRc hex=$(Format-RcHex $diagnosticRc) start=$($startLines.Count) fn_start=$($fnStartLines.Count) fn_pass=$($fnPassLines.Count) fn_fail=$($fnFailLines.Count) finish=$($finishLines.Count) exit_code=$($exitLines.Count) contract=$markerContract"
              foreach ($marker in @($markers | Select-Object -First 32)) { Write-Host "ISSUE74_MARKER $key $marker" }
              if (-not $markerContract) {
                Write-Warning "ISSUE74_MARKER_CONTRACT generation=$($generation.Name) probe=$($probe.Name) expected_tests=$($probe.Expected) failed"
              }

              $peReady = $false
              try {
                $cFiles = @(Get-ChildItem -LiteralPath $ownerTempItem.FullName -Recurse -File -Force | Where-Object { $_.Extension -ceq '.c' })
                if (@($cFiles | Where-Object { ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 }).Count -ne 0 -or
                    $cFiles.Count -ne 1 -or $cFiles[0].Length -le 0 -or $cFiles[0].Length -gt 8388608) {
                  throw "Expected exactly one bounded generated C file, found $($cFiles.Count)"
                }
                $cLines = @(Get-Content -LiteralPath $cFiles[0].FullName -ErrorAction Stop)
                Write-Host "ISSUE74_C_PATH key=$key path=$($cFiles[0].FullName) bytes=$($cFiles[0].Length)"
                Write-CFunctionSnippet $cLines '^\s*int\s+(?:WINAPI\s+)?(?:wWinMain|wmain|main)\s*\([^;{}]*\)\s*\{\s*$' "$key-main"
                Write-CFunctionSnippet $cLines '^\s*void\s+_vinit\s*\(\s*int\s+___argc\s*,\s*voidptr\s+___argv\s*\)\s*\{\s*$' "$key-vinit"
                Write-CFunctionSnippet $cLines '^\s*main__vtest_init\(\);\s*$' "$key-vtest-init-call"
                Write-CFunctionSnippet $cLines '^\s*_vinit\s*\(\s*___argc\s*,\s*\(voidptr\)\s*___argv\s*\)\s*;\s*$' "$key-vinit-call"
                Write-CFunctionSnippet $cLines '^\s*_vtrunner\._method_start\(_vtobj,\s*[0-9]+\);\s*$' "$key-dump-start"
                Write-CFunctionSnippet $cLines '^\s*(?:static\s+)?void\s+_vcleanup\s*\(void\)\s*\{' "$key-cleanup"
                if (-not [string]::IsNullOrEmpty([string]$probe.CName)) {
                  $selectedPattern = '^\s*(?:void|int)\s+' + [regex]::Escape([string]$probe.CName) + '\s*\([^;]*\)\s*\{'
                  Write-CFunctionSnippet $cLines $selectedPattern "$key-selected"
