                  $peRc = $LASTEXITCODE
                  $peEvidence = @($peOutput | Where-Object { $_ -match '^\s*(Machine|Subsystem|Name):' } | Select-Object -First 256)
                  Write-Host "ISSUE74_PE key=$key path=$($ownerExeItem.FullName) bytes=$($ownerExeItem.Length) rc=$peRc evidence=$($peEvidence.Count)"
                  foreach ($line in $peEvidence) { Write-Host $line }
                  if ($peRc -ne 0 -or $peEvidence.Count -eq 0) { Write-Warning "llvm-readobj exact-PE capability failed for $key" }
                } else {
                  Write-Warning "LLVM PE inspection unavailable for $key"
                }
              } catch {
                Write-Warning "ISSUE74_PE_COLLECTION key=$key warning=$($_.Exception.Message)"
              }
              $observations[$key] = @{ Rc = $diagnosticRc; Hex = (Format-RcHex $diagnosticRc); Start = $startLines.Count; FnStart = $fnStartLines.Count; FnPass = $fnPassLines.Count; FnFail = $fnFailLines.Count; Finish = $finishLines.Count; ExitCode = $exitLines.Count; Contract = $markerContract; Pe = $peReady }
            } catch {
              Write-Warning "ISSUE74_INSTRUMENTATION key=$key warning=$($_.Exception.Message)"
              $observations[$key] = @{ Rc = $null; Hex = 'unavailable'; Start = 0; FnStart = 0; FnPass = 0; FnFail = 0; Finish = 0; ExitCode = 0; Contract = $false; Pe = $false }
            }
          }
        }

        foreach ($generation in $generations) {
          foreach ($probe in @($probes | Where-Object { $_.Name -in @('empty', 'selected') })) {
            $observation = $observations["$($generation.Name)-$($probe.Name)"]
            if ($null -eq $observation -or $observation.Hex -cne '0xC0000409') {
              continue
            }
            try {
              $gcTemp = Join-Path $env:RUNNER_TEMP "issue74-host-clang-$($generation.Name)-$($probe.Name)-gc-none"
              if (Test-Path -LiteralPath $gcTemp) { throw "Fresh gc-none VTMP already exists: $gcTemp" }
              New-Item -ItemType Directory -Path $gcTemp | Out-Null
              $gcTempItem = Get-Item -LiteralPath $gcTemp -Force
              if (-not $gcTempItem.PSIsContainer -or ($gcTempItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw "gc-none VTMP is not real" }
              $gcExe = Join-Path $gcTempItem.FullName 'owner.exe'
              if (Test-Path -LiteralPath $gcExe) { throw "Fresh gc-none owner PE already exists: $gcExe" }
              $env:VTMP = $gcTempItem.FullName
              $gcArgs = @($generation.Args)
              & v @gcArgs -no-parallel -cc clang -no-retry-compilation -showcc -keepc -gc none -o $gcExe -test-runner dump -run-only $probe.Function run $probe.File 1> (Join-Path $gcTemp 'diagnostic.stdout.txt') 2> (Join-Path $gcTemp 'diagnostic.stderr.txt')
              $gcRc = $LASTEXITCODE
              Write-Host "ISSUE74_GC_NONE generation=$($generation.Name) probe=$($probe.Name) rc=$gcRc hex=$(Format-RcHex $gcRc)"
              [void](Write-BoundedDiagnostic (Join-Path $gcTemp 'diagnostic.stdout.txt') "$($generation.Name)-$($probe.Name)-gc-none-stdout")
              [void](Write-BoundedDiagnostic (Join-Path $gcTemp 'diagnostic.stderr.txt') "$($generation.Name)-$($probe.Name)-gc-none-stderr")
            } catch {
              Write-Warning "ISSUE74_GC_NONE generation=$($generation.Name) probe=$($probe.Name) warning=$($_.Exception.Message)"
            }
          }
        }

        $checkoutItem = $null
        try {
          $checkoutItem = Get-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'gui') -Force -ErrorAction Stop
          if (-not $checkoutItem.PSIsContainer -or ($checkoutItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'checkout is not a real directory' }
        } catch {
          Write-Warning "ISSUE74_LLDB canonical checkout is unavailable: $($_.Exception.Message)"
        }
        if ($null -ne $checkoutItem) {
          foreach ($generation in $generations) {
            foreach ($probe in @($probes | Where-Object { $_.Name -in @('empty', 'selected') })) {
              $observation = $observations["$($generation.Name)-$($probe.Name)"]
              if ($null -eq $observation -or $observation.Hex -cne '0xC0000409') { continue }
              try {
                $debugTemp = Join-Path $env:RUNNER_TEMP "issue74-host-clang-$($generation.Name)-$($probe.Name)-lldb"
                if (Test-Path -LiteralPath $debugTemp) { throw "Fresh LLDB VTMP already exists: $debugTemp" }
                New-Item -ItemType Directory -Path $debugTemp | Out-Null
                $debugTempItem = Get-Item -LiteralPath $debugTemp -Force
                if (-not $debugTempItem.PSIsContainer -or ($debugTempItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'LLDB VTMP is not a real directory' }
                $debugExe = Join-Path $debugTempItem.FullName 'debug.exe'
                if (Test-Path -LiteralPath $debugExe) { throw "Fresh debug PE already exists: $debugExe" }
                $compileStdout = Join-Path $debugTempItem.FullName 'compile.stdout.txt'
                $compileStderr = Join-Path $debugTempItem.FullName 'compile.stderr.txt'
                $env:VTMP = $debugTempItem.FullName
                $debugCompilerArgs = @($generation.Args)
                & v @debugCompilerArgs -no-parallel -cc clang -no-retry-compilation -showcc -keepc -g -skip-running -o $debugExe -test-runner dump -run-only $probe.Function run $probe.File 1> $compileStdout 2> $compileStderr
                $compileRc = $LASTEXITCODE
                Write-Host "ISSUE74_DEBUG_COMPILE generation=$($generation.Name) probe=$($probe.Name) rc=$compileRc hex=$(Format-RcHex $compileRc)"
                [void](Write-BoundedDiagnostic $compileStdout "$($generation.Name)-$($probe.Name)-debug-compile-stdout")
                [void](Write-BoundedDiagnostic $compileStderr "$($generation.Name)-$($probe.Name)-debug-compile-stderr")
                if ($compileRc -ne 0) { throw "Debug clone compile failed: rc=$compileRc" }
                $debugExeItem = Get-Item -LiteralPath $debugExe -Force -ErrorAction Stop
                if (-not ($debugExeItem -is [IO.FileInfo]) -or ($debugExeItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
                    $debugExeItem.Length -le 0 -or $debugExeItem.Length -gt 67108864) { throw 'Debug clone PE is not a bounded real file' }

                $direct = Invoke-BoundedProcess -FilePath $debugExeItem.FullName -ArgumentList ([string[]]@()) -WorkingDirectory $checkoutItem.FullName -Prefix (Join-Path $debugTempItem.FullName 'direct')
                Write-Host "ISSUE74_DEBUG_DIRECT generation=$($generation.Name) probe=$($probe.Name) rc=$($direct.Rc) hex=$($direct.Hex)"
                [void](Write-BoundedDiagnostic $direct.Stdout "$($generation.Name)-$($probe.Name)-debug-direct-stdout")
                [void](Write-BoundedDiagnostic $direct.Stderr "$($generation.Name)-$($probe.Name)-debug-direct-stderr")
                if ($direct.Hex -cne '0xC0000409') {
                  Write-Warning "Debug clone did not reproduce C0000409 for $($generation.Name)-$($probe.Name)"
                  continue
                }
                $lldbItem = Get-LldbDiagnosticTool -WorkingDirectory $checkoutItem.FullName -PrefixRoot $debugTempItem.FullName
                if ($null -eq $lldbItem) { continue }
                $lldbArgs = @('--batch', '-o', 'run', '-o', '"thread backtrace all"', '--', ('"{0}"' -f $debugExeItem.FullName))
                $lldb = Invoke-BoundedProcess -FilePath $lldbItem.FullName -ArgumentList $lldbArgs -WorkingDirectory $checkoutItem.FullName -Prefix (Join-Path $debugTempItem.FullName 'lldb')
                Write-Host "ISSUE74_LLDB_RUN generation=$($generation.Name) probe=$($probe.Name) rc=$($lldb.Rc) hex=$($lldb.Hex)"
                [void](Write-BoundedDiagnostic $lldb.Stdout "$($generation.Name)-$($probe.Name)-lldb-stdout")
                [void](Write-BoundedDiagnostic $lldb.Stderr "$($generation.Name)-$($probe.Name)-lldb-stderr")
              } catch {
                Write-Warning "ISSUE74_LLDB generation=$($generation.Name) probe=$($probe.Name) warning=$($_.Exception.Message)"
              }
            }
          }
        }
        if ($null -ne $checkoutItem) {
          foreach ($generation in $generations) {
            foreach ($probe in @($probes | Where-Object { $_.Name -in @('empty', 'selected') })) {
              $observation = $observations["$($generation.Name)-$($probe.Name)"]
              if ($null -eq $observation -or $observation.Hex -cne '0xC0000409') { continue }
              try {
                $asanTemp = Join-Path $env:RUNNER_TEMP "issue74-host-clang-$($generation.Name)-$($probe.Name)-asan"
                if (Test-Path -LiteralPath $asanTemp) { throw "Fresh ASan VTMP already exists: $asanTemp" }
                New-Item -ItemType Directory -Path $asanTemp | Out-Null
                $asanTempItem = Get-Item -LiteralPath $asanTemp -Force
                if (-not $asanTempItem.PSIsContainer -or ($asanTempItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'ASan VTMP is not real' }
                $asanExe = Join-Path $asanTempItem.FullName 'asan.exe'
                $asanCompileOut = Join-Path $asanTempItem.FullName 'compile.stdout.txt'
                $asanCompileErr = Join-Path $asanTempItem.FullName 'compile.stderr.txt'
                $env:VTMP = $asanTempItem.FullName
                $asanCompilerArgs = @($generation.Args)
                & v @asanCompilerArgs -no-parallel -cc clang -no-retry-compilation -showcc -keepc -g -skip-running -o $asanExe -cflags '-fsanitize=address' -cflags '-fno-omit-frame-pointer' -test-runner dump -run-only $probe.Function run $probe.File 1> $asanCompileOut 2> $asanCompileErr
                $asanCompileRc = $LASTEXITCODE
                Write-Host "ISSUE74_ASAN_COMPILE generation=$($generation.Name) probe=$($probe.Name) rc=$asanCompileRc hex=$(Format-RcHex $asanCompileRc)"
                [void](Write-BoundedDiagnostic $asanCompileOut "$($generation.Name)-$($probe.Name)-asan-compile-stdout")
                [void](Write-BoundedDiagnostic $asanCompileErr "$($generation.Name)-$($probe.Name)-asan-compile-stderr")
                if ($asanCompileRc -ne 0) { throw "ASan compile failed: rc=$asanCompileRc" }
                $asanExeItem = Get-Item -LiteralPath $asanExe -Force -ErrorAction Stop
                if (-not ($asanExeItem -is [IO.FileInfo]) -or ($asanExeItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or $asanExeItem.Length -le 0 -or $asanExeItem.Length -gt 67108864) { throw 'ASan PE is not a bounded real file' }
                $asanTools = Get-LlvmDiagnosticTools
                if ($null -eq $asanTools) { throw 'ASan PE inspection tools unavailable' }
                $imports = Invoke-BoundedProcess -FilePath $asanTools.Readobj.FullName -ArgumentList ([string[]]@('--coff-imports', $asanExeItem.FullName)) -WorkingDirectory $checkoutItem.FullName -Prefix (Join-Path $asanTempItem.FullName 'readobj')
                $importLines = @()
                $importLines += @(Write-BoundedDiagnostic $imports.Stdout "$($generation.Name)-$($probe.Name)-asan-readobj-stdout")
                $importLines += @(Write-BoundedDiagnostic $imports.Stderr "$($generation.Name)-$($probe.Name)-asan-readobj-stderr")
                if ($imports.Rc -ne 0) { throw 'ASan PE import inspection failed' }
                $asanDlls = @($importLines | ForEach-Object { [regex]::Match($_.Trim(), '^Name: (clang_rt\.asan[^\\/:]*\.dll)$') } | Where-Object { $_.Success } | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique)
                if ($asanDlls.Count -ne 1) { throw "ASan runtime DLL cardinality mismatch: $($asanDlls.Count)" }
                $resource = Invoke-BoundedProcess -FilePath $asanTools.Clang.FullName -ArgumentList ([string[]]@('-print-resource-dir')) -WorkingDirectory $checkoutItem.FullName -Prefix (Join-Path $asanTempItem.FullName 'resource-dir')
                $resourceLines = @()
                $resourceLines += @(Write-BoundedDiagnostic $resource.Stdout "$($generation.Name)-$($probe.Name)-asan-resource-stdout")
                $resourceLines += @(Write-BoundedDiagnostic $resource.Stderr "$($generation.Name)-$($probe.Name)-asan-resource-stderr")
                if ($resource.Rc -ne 0 -or $resourceLines.Count -ne 1) { throw 'Clang resource-dir provenance failed' }
                $resourceItem = Get-Item -LiteralPath $resourceLines[0].Trim() -Force -ErrorAction Stop
                $llvmRoot = [IO.Path]::GetFullPath((Join-Path $env:ProgramFiles 'LLVM')).TrimEnd('\')
                if (-not $resourceItem.PSIsContainer -or ($resourceItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or -not [IO.Path]::GetFullPath($resourceItem.FullName).StartsWith($llvmRoot + '\', [StringComparison]::OrdinalIgnoreCase)) { throw 'Clang resource-dir escaped LLVM root' }
                $asanDllItem = Get-Item -LiteralPath (Join-Path $resourceItem.FullName "lib\windows\$($asanDlls[0])") -Force -ErrorAction Stop
                if (-not ($asanDllItem -is [IO.FileInfo]) -or ($asanDllItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or $asanDllItem.Length -le 0 -or $asanDllItem.Length -gt 67108864) { throw 'ASan runtime DLL is not a bounded real file' }
                $symbolizerItem = Get-Item -LiteralPath (Join-Path $llvmRoot 'bin\llvm-symbolizer.exe') -Force -ErrorAction Stop
                if (-not ($symbolizerItem -is [IO.FileInfo]) -or ($symbolizerItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'ASan symbolizer is not a real file' }
                $symbolizerVersion = Invoke-BoundedProcess -FilePath $symbolizerItem.FullName -ArgumentList ([string[]]@('--version')) -WorkingDirectory $checkoutItem.FullName -Prefix (Join-Path $asanTempItem.FullName 'symbolizer-version')
                $symbolizerLines = @()
                $symbolizerLines += @(Write-BoundedDiagnostic $symbolizerVersion.Stdout "$($generation.Name)-$($probe.Name)-symbolizer-version-stdout")
                $symbolizerLines += @(Write-BoundedDiagnostic $symbolizerVersion.Stderr "$($generation.Name)-$($probe.Name)-symbolizer-version-stderr")
                $symbolizerMatches = @($symbolizerLines | ForEach-Object { [regex]::Match($_.Trim(), '^LLVM version ([0-9]+)\.') } | Where-Object { $_.Success })
                if ($symbolizerVersion.Rc -ne 0 -or $symbolizerMatches.Count -ne 1) { throw 'ASan symbolizer version provenance failed' }
                $symbolizerMajor = [int]$symbolizerMatches[0].Groups[1].Value
                if ($symbolizerMajor -ne [int]$asanTools.ClangMajor) { throw 'ASan clang/symbolizer major mismatch' }
                $oldPath = $env:PATH
                $hadAsanOptions = Test-Path Env:ASAN_OPTIONS
                $hadSymbolizerPath = Test-Path Env:ASAN_SYMBOLIZER_PATH
                $oldAsanOptions = [Environment]::GetEnvironmentVariable('ASAN_OPTIONS', 'Process')
                $oldSymbolizerPath = [Environment]::GetEnvironmentVariable('ASAN_SYMBOLIZER_PATH', 'Process')
                try {
                  $env:PATH = "$($asanDllItem.DirectoryName);$oldPath"
                  $env:ASAN_OPTIONS = 'abort_on_error=1:halt_on_error=1:symbolize=1:detect_leaks=0'
                  $env:ASAN_SYMBOLIZER_PATH = $symbolizerItem.FullName
                  $asanRun = Invoke-BoundedProcess -FilePath $asanExeItem.FullName -ArgumentList ([string[]]@()) -WorkingDirectory $checkoutItem.FullName -Prefix (Join-Path $asanTempItem.FullName 'run')
                  Write-Host "ISSUE74_ASAN_RUN generation=$($generation.Name) probe=$($probe.Name) rc=$($asanRun.Rc) hex=$($asanRun.Hex) runtime=$($asanDllItem.Name)"
                  [void](Write-BoundedDiagnostic $asanRun.Stdout "$($generation.Name)-$($probe.Name)-asan-run-stdout")
                  [void](Write-BoundedDiagnostic $asanRun.Stderr "$($generation.Name)-$($probe.Name)-asan-run-stderr")
                } finally {
                  $env:PATH = $oldPath
                  if (-not $hadAsanOptions) { Remove-Item Env:ASAN_OPTIONS -ErrorAction SilentlyContinue } else { $env:ASAN_OPTIONS = $oldAsanOptions }
                  if (-not $hadSymbolizerPath) { Remove-Item Env:ASAN_SYMBOLIZER_PATH -ErrorAction SilentlyContinue } else { $env:ASAN_SYMBOLIZER_PATH = $oldSymbolizerPath }
                }
              } catch {
                Write-Warning "ISSUE74_ASAN generation=$($generation.Name) probe=$($probe.Name) warning=$($_.Exception.Message)"
              }
            }
          }
        }
        exit $primaryRc
    - name: Compile native smoke examples
      run: |
        v -no-parallel -cc clang -W -o dialogs_smoke.exe gui/examples/dialogs.v
        v -no-parallel -cc clang -W -o printing_smoke.exe gui/examples/printing.v
        v -no-parallel -cc clang -W -o notification_smoke.exe gui/examples/native_notification.v
        if ('${{ inputs.run_d3d11 }}' -eq 'true') {
          $d3dExamples = @(
            @{ Name = 'printing'; Path = 'gui/examples/printing.v'; Warn = $true },
            @{ Name = 'gradient_demo'; Path = 'gui/examples/gradient_demo.v'; Warn = $true },
            @{ Name = 'shadow_demo'; Path = 'gui/examples/shadow_demo.v'; Warn = $true },
            @{ Name = 'blur_demo'; Path = 'gui/examples/blur_demo.v'; Warn = $true },
            @{ Name = 'image_clip'; Path = 'gui/examples/image_clip.v'; Warn = $true },
            @{ Name = 'svg_demo'; Path = 'gui/examples/svg_demo.v'; Warn = $true },
            @{ Name = 'custom_shader'; Path = 'gui/examples/custom_shader.v'; Warn = $true },
            @{ Name = 'showcase'; Path = 'gui/examples/showcase.v'; Warn = $false }
          )
          foreach ($example in $d3dExamples) {
            $args = @('-no-parallel', '-cc', 'clang', '-d', 'sokol_d3d11')
            if ($example.Warn) {
              $args += '-W'
            }
            $args += @('-o', "$($example.Name)_d3d11_smoke.exe", $example.Path)
            v @args
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
        }

  resolve-ucrt64-revisions:
    name: Resolve WinGNU diagnostic revisions
    runs-on: ubuntu-latest
    if: ${{ !inputs.prewarm_deps_only && inputs.run_mingw }}
    outputs:
      v_revision: ${{ steps.revisions.outputs.v_revision }}
      vglyph_revision: ${{ steps.revisions.outputs.vglyph_revision }}
    steps:
    - name: Resolve shared upstream revisions
      id: revisions
      shell: bash
      run: |
        set -euo pipefail
        v_revision='${{ env.V_REVISION }}'
        vglyph_revision='${{ env.VGLYPH_REVISION }}'
        [[ "$v_revision" =~ ^[0-9a-f]{40}$ ]]
        [[ "$vglyph_revision" =~ ^[0-9a-f]{40}$ ]]
        echo "V revision: $v_revision"
        echo "vglyph revision: $vglyph_revision"
        echo "v_revision=$v_revision" >> "$GITHUB_OUTPUT"
        echo "vglyph_revision=$vglyph_revision" >> "$GITHUB_OUTPUT"

  mingw:
    name: MSYS2 ${{ matrix.lane }} native/static smoke
    needs: resolve-ucrt64-revisions
    runs-on: windows-2025
    timeout-minutes: 240
    if: ${{ !inputs.prewarm_deps_only && inputs.run_mingw }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - lane: ucrt64-gcc
          msystem: UCRT64
          dependency_prefix: mingw-w64-ucrt-x86_64
          cc: gcc
          cxx: g++
          compiler_package: mingw-w64-ucrt-x86_64-gcc
          nm_tool: nm
          object_package: mingw-w64-ucrt-x86_64-binutils
          object_tool: objdump
          lld_package: ''
        - lane: ucrt64-clang
          msystem: UCRT64
          dependency_prefix: mingw-w64-ucrt-x86_64
          cc: clang
          cxx: clang++
          compiler_package: mingw-w64-ucrt-x86_64-clang
          nm_tool: nm
          object_package: mingw-w64-ucrt-x86_64-binutils
          object_tool: objdump
          lld_package: mingw-w64-ucrt-x86_64-lld
        - lane: clang64-clang
          msystem: CLANG64
          dependency_prefix: mingw-w64-clang-x86_64
          cc: clang
          cxx: clang++
          compiler_package: mingw-w64-clang-x86_64-clang
          nm_tool: llvm-nm
          object_package: mingw-w64-clang-x86_64-llvm-tools
          object_tool: llvm-objdump
          lld_package: ''
        - lane: mingw64-gcc
          msystem: MINGW64
          dependency_prefix: mingw-w64-x86_64
          cc: gcc
          cxx: g++
          compiler_package: mingw-w64-x86_64-gcc
          nm_tool: nm
          object_package: mingw-w64-x86_64-binutils
          object_tool: objdump
          lld_package: ''
    steps:
    - name: Resolve V revision
      id: v
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $revision = '${{ needs.resolve-ucrt64-revisions.outputs.v_revision }}'
        if ($revision -notmatch '^[0-9a-f]{40}$') {
          throw "V revision is not an exact 40-hex SHA: $revision"
        }
        Write-Host "V revision: $revision"
        "revision=$revision" | Add-Content -Path $env:GITHUB_OUTPUT
    - name: Restore V compiler cache
      id: restore-v-cache
      uses: actions/cache/restore@v4
      with:
        path: v
        key: windows-v-compiler-${{ steps.v.outputs.revision }}-v1
    - name: Install V
      id: install-v
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        function Assert-NativeCommand($Message) {
          if ($LASTEXITCODE -ne 0) {
            throw $Message
          }
        }
        $expectedRevision = '${{ steps.v.outputs.revision }}'
        if (Test-Path .\v\v.exe) {
          $cachedRevision = ( & git -C v rev-parse HEAD).Trim()
          Assert-NativeCommand "Could not inspect cached V revision"
          if ($cachedRevision -ne $expectedRevision) {
            Write-Host "Cached V revision $cachedRevision does not match expected $expectedRevision; rebuilding."
            Remove-Item -Recurse -Force .\v
          }
        }
        if (-not (Test-Path .\v\v.exe)) {
          if (Test-Path .\v) {
            Remove-Item -Recurse -Force .\v
          }
          git init v
          Assert-NativeCommand "git init failed"
          git -C v remote add origin '${{ env.V_REPOSITORY }}'
          Assert-NativeCommand "git remote add failed"
          git -C v fetch --depth 1 origin $expectedRevision
          Assert-NativeCommand "git fetch failed"
          git -C v checkout --detach FETCH_HEAD
          Assert-NativeCommand "git checkout failed"
          Push-Location v
          cmd /c makev.bat
          if ($LASTEXITCODE -ne 0) {
            throw "makev.bat failed"
          }
          Pop-Location
        }
        $vPath = (Resolve-Path .\v).Path
        Add-Content -Path $env:GITHUB_PATH -Value $vPath
        $version = ( & .\v\v.exe version).Trim()
        $revision = ( & git -C v rev-parse HEAD).Trim()
        Assert-NativeCommand "Could not inspect V revision"
        if ($revision -ne $expectedRevision) {
          throw "Installed V revision $revision does not match expected $expectedRevision"
        }
        Write-Host "Resolved V revision: $revision"
        "version=$version" | Add-Content -Path $env:GITHUB_OUTPUT
        "revision=$revision" | Add-Content -Path $env:GITHUB_OUTPUT
    - name: Log V version and revision
      shell: pwsh
      run: |
        v version
        git -C v rev-parse HEAD
    - name: Save V compiler cache
      if: ${{ matrix.lane == 'ucrt64-gcc' && steps.restore-v-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: v
        key: ${{ steps.restore-v-cache.outputs.cache-primary-key }}
    - name: Resolve vglyph revision
      id: vglyph
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $revision = '${{ needs.resolve-ucrt64-revisions.outputs.vglyph_revision }}'
        if ($revision -notmatch '^[0-9a-f]{40}$') {
          throw "vglyph revision is not an exact 40-hex SHA: $revision"
        }
        Write-Host "vglyph revision: $revision"
        "revision=$revision" | Add-Content -Path $env:GITHUB_OUTPUT
    - name: Restore V module cache
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}\.vmodules\vglyph
        key: windows-vmodules-vglyph-${{ steps.install-v.outputs.revision }}-${{ steps.vglyph.outputs.revision }}-v2
        restore-keys: |
          windows-vmodules-vglyph-${{ steps.install-v.outputs.revision }}-
          windows-vmodules-vglyph-
    - name: Install selected MSYS2 dependencies
      id: msys2
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.msystem }}
        update: true
        cache: false
        path-type: minimal
        install: >-
          git
          ${{ matrix.compiler_package }}
          ${{ matrix.object_package }}
          ${{ matrix.lld_package }}
          ${{ matrix.dependency_prefix }}-pkgconf
          ${{ matrix.dependency_prefix }}-pango
          ${{ matrix.dependency_prefix }}-freetype
          ${{ matrix.dependency_prefix }}-gettext-runtime
          ${{ matrix.dependency_prefix }}-libiconv
    - name: Verify V and compiler versions in MSYS2
      shell: msys2 {0}
      run: |
        set -euo pipefail
        cc='${{ matrix.cc }}'
        cxx='${{ matrix.cxx }}'
        cc_exe="$(realpath "$(command -v "${cc}.exe")")"
        cxx_exe="$(realpath "$(command -v "${cxx}.exe")")"
        export PATH="$PWD/v:$PATH"
        if [ "$MSYSTEM" != '${{ matrix.msystem }}' ]; then
          echo "Expected ${{ matrix.msystem }}, got $MSYSTEM" >&2
          exit 1
        fi
        v version
        command -v "$cc"
        command -v "$cxx"
        test -f "$cc_exe" && test -x "$cc_exe"
        test -f "$cxx_exe" && test -x "$cxx_exe"
        case "$cc_exe:$cxx_exe" in
          "$MINGW_PREFIX"/bin/*.exe:"$MINGW_PREFIX"/bin/*.exe) ;;
          *) echo "Compiler pair escaped $MINGW_PREFIX/bin: $cc_exe / $cxx_exe" >&2; exit 1 ;;
        esac
        command -v pkgconf
        command -v pkg-config
        "$cc" --version
        "$cxx" --version
        pkgconf --version
        pkg-config --version
        for tool in "$cc" "$cxx" pkgconf pkg-config ld '${{ matrix.nm_tool }}' '${{ matrix.object_tool }}'; do
          case "$(command -v "$tool")" in
            "$MINGW_PREFIX"/bin/*) ;;
            *)
              echo "$tool did not resolve inside $MSYSTEM: $(command -v "$tool")" >&2
              exit 1
              ;;
          esac
        done
        if [[ -n '${{ matrix.lld_package }}' ]]; then
          pacman -Q '${{ matrix.lld_package }}'
          lld_path="$(command -v ld.lld.exe)"
          case "$lld_path" in
            "$MINGW_PREFIX"/bin/*) ;;
            *) echo "LLD escaped $MINGW_PREFIX/bin: $lld_path" >&2; exit 1 ;;
          esac
          test -f "$lld_path" && test -x "$lld_path"
          clang_version="$("$cc_exe" --version 2>&1)"
          clang_version_num="$(sed -n 's/.*clang version \([^[:space:]]*\).*/\1/p' <<< "$clang_version" | head -n 1)"
          lld_version="$("$lld_path" --version 2>&1)"
          lld_version_num="$(sed -n 's/^LLD \([^[:space:]]*\).*/\1/p' <<< "$lld_version" | head -n 1)"
          [[ -n "$clang_version_num" && "$lld_version_num" == "$clang_version_num" ]]
          lld_route="$(printf '' | "$cc_exe" -### -fuse-ld=lld -x c - -o NUL 2>&1)"
          printf '%s\n' "$lld_version" "$lld_route"
          grep -Eiq '[/\\]ld\.lld(\.exe)?' <<< "$lld_route"
        fi
    - name: Ensure vglyph revision
      shell: msys2 {0}
      run: |
        set -euo pipefail
        expected_revision='${{ steps.vglyph.outputs.revision }}'
        vmodules_posix="$PWD/.vmodules"
        export VMODULES="$(cygpath -w "$vmodules_posix")"
        vglyph_path="$vmodules_posix/vglyph"
        if [ -d "$vglyph_path/.git" ]; then
          cached_revision=$(git -C "$vglyph_path" rev-parse HEAD | tr -d '[:space:]')
          if [ "$cached_revision" != "$expected_revision" ]; then
            echo "Cached vglyph revision $cached_revision does not match expected $expected_revision; rebuilding."
            rm -rf "$vglyph_path"
          fi
        elif [ -e "$vglyph_path" ]; then
          rm -rf "$vglyph_path"
        fi
        if [ ! -e "$vglyph_path" ]; then
          mkdir -p "$(dirname "$vglyph_path")"
          git init "$vglyph_path"
          git -C "$vglyph_path" remote add origin '${{ env.VGLYPH_REPOSITORY }}'
          git -C "$vglyph_path" fetch --depth 1 origin "$expected_revision"
          git -C "$vglyph_path" checkout --detach FETCH_HEAD
        fi
        test -f "$vglyph_path/v.mod"
        resolved_revision="$(git -C "$vglyph_path" rev-parse HEAD | tr -d '[:space:]')"
        test "$resolved_revision" = "$expected_revision"
        printf 'VMODULES=%s\n' "$VMODULES"
        printf 'Resolved vglyph revision: %s\n' "$resolved_revision"
    - name: Checkout gui
      uses: actions/checkout@v4
      with:
        path: gui
    - name: Validate native V module resolution
      shell: msys2 {0}
      run: |
        set -euo pipefail
        vmodules_posix="$PWD/.vmodules"
        export VMODULES="$(cygpath -w "$vmodules_posix")"
        test -f "$vmodules_posix/vglyph/v.mod"
        ./v/v.exe -check gui/.github/workflows/issue74/vglyph_probe.v
    - name: Restore standalone V3 cache
      id: restore-v3
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}\v3-gui-${{ matrix.lane }}.exe
        key: windows-v3-${{ env.V_REVISION }}-${{ matrix.lane }}-schema1
    - name: Build and validate standalone V3
      shell: msys2 {0}
      run: |
        set -euo pipefail
        unset VFLAGS CFLAGS LDFLAGS
        vroot="$PWD/v"
        runner_temp_posix="$(cygpath -u "$RUNNER_TEMP")"
        cached_v3="$runner_temp_posix/v3-gui-${{ matrix.lane }}.exe"
        v3="$vroot/v3-gui-${{ matrix.lane }}.exe"
        state="$runner_temp_posix/v3-gui-${{ matrix.lane }}"
        rm -rf "$state"
        mkdir -p "$state/vmodules" "$state/vcache" "$state/v3cache" "$state/vtmp"
        vlib_path="$(cygpath -w "$vroot/vlib")|@vlib|@vmodules"
        cc_exe="$(realpath "$(command -v '${{ matrix.cc }}.exe')")"
        cxx_exe="$(realpath "$(command -v '${{ matrix.cxx }}.exe')")"
        test -f "$cc_exe" && test -x "$cc_exe"
        test -f "$cxx_exe" && test -x "$cxx_exe"
        case "$cc_exe:$cxx_exe" in
          "$MINGW_PREFIX"/bin/*.exe:"$MINGW_PREFIX"/bin/*.exe) ;;
          *) echo "Compiler pair escaped $MINGW_PREFIX/bin: $cc_exe / $cxx_exe" >&2; exit 1 ;;
        esac
        cc_windows="$(cygpath -w "$cc_exe")"
        cxx_windows="$(cygpath -w "$cxx_exe")"
        if [ -f "$cached_v3" ]; then
          test ! -L "$cached_v3"
          cp "$cached_v3" "$v3"
        else
          ./v/v.exe -old-compiler -gc none -path "$vlib_path" \
            -cc "$cc_windows" -c++ "$cxx_windows" \
            -no-retry-compilation -o "$(cygpath -w "$v3")" \
            "$(cygpath -w "$vroot/vlib/v3/v3.v")"
          cp "$v3" "$cached_v3"
        fi
        test -x "$v3"
        printf '%s\n' 'module main' "fn main() { println('v3-gui-ok') }" > "$state/canary.v"
        VMODULES="$(cygpath -w "$state/vmodules")" \
          VCACHE="$(cygpath -w "$state/vcache")" \
          V3CACHE="$(cygpath -w "$state/v3cache")" \
          VTMP="$(cygpath -w "$state/vtmp")" \
          "$v3" -gc none -no-parallel -path "$vlib_path" \
            -cc "$cc_windows" -c++ "$cxx_windows" \
            -o "$(cygpath -w "$state/canary.exe")" "$(cygpath -w "$state/canary.v")"
        test "$("$state/canary.exe")" = v3-gui-ok
        helper_root="$state/helpers"
        mkdir -p "$helper_root/v1" "$helper_root/v3"
        final_link_source="$PWD/gui/.github/workflows/issue74/verify_final_link.v"
        results_source="$PWD/gui/.github/workflows/issue74/verify_results.v"
        test -f "$final_link_source" && test ! -L "$final_link_source"
        test -f "$results_source" && test ! -L "$results_source"
        compile_helper() {
          local generation="$1" source="$2" output="$3" helper_state="$4"
          rm -rf "$helper_state"
          mkdir -p "$helper_state/vmodules" "$helper_state/vcache" "$helper_state/v3cache" "$helper_state/vtmp"
          local -a compiler=("./v/v.exe" -old-compiler)
          if [ "$generation" = v3 ]; then
            compiler=("$v3")
          fi
          VMODULES="$(cygpath -w "$helper_state/vmodules")" \
            VCACHE="$(cygpath -w "$helper_state/vcache")" \
            V3CACHE="$(cygpath -w "$helper_state/v3cache")" \
            VTMP="$(cygpath -w "$helper_state/vtmp")" \
            "${compiler[@]}" -gc none -no-parallel -path "$vlib_path" \
              -cc "$cc_windows" -c++ "$cxx_windows" -no-retry-compilation \
              -o "$(cygpath -w "$output")" "$(cygpath -w "$source")"
          test -f "$output" && test ! -L "$output" && test -x "$output"
        }
        final_link_v1="$helper_root/v1/verify-final-link.exe"
        final_link_v3="$helper_root/v3/verify-final-link.exe"
        results_v1="$helper_root/v1/verify-results.exe"
        results_v3="$helper_root/v3/verify-results.exe"
        compile_helper v1 "$final_link_source" "$final_link_v1" "$helper_root/v1/final-link-state"
        compile_helper v3 "$final_link_source" "$final_link_v3" "$helper_root/v3/final-link-state"
        compile_helper v1 "$results_source" "$results_v1" "$helper_root/v1/results-state"
        compile_helper v3 "$results_source" "$results_v3" "$helper_root/v3/results-state"
        "$final_link_v1" --selftest
        "$final_link_v3" --selftest
        "$results_v1" --self-test
        "$results_v3" --self-test
        echo "ISSUE74_VERIFY_FINAL_LINK_V1=$(cygpath -w "$final_link_v1")" >> "$GITHUB_ENV"
        echo "ISSUE74_VERIFY_FINAL_LINK_V3=$(cygpath -w "$final_link_v3")" >> "$GITHUB_ENV"
        echo "ISSUE74_VERIFY_RESULTS_V1=$(cygpath -w "$results_v1")" >> "$GITHUB_ENV"
        echo "ISSUE74_VERIFY_RESULTS_V3=$(cygpath -w "$results_v3")" >> "$GITHUB_ENV"
        echo "V3_GNU_STANDALONE=$(cygpath -w "$v3")" >> "$GITHUB_ENV"
    - name: Save standalone V3 cache
      if: ${{ steps.restore-v3.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}\v3-gui-${{ matrix.lane }}.exe
        key: ${{ steps.restore-v3.outputs.cache-primary-key }}
    - name: "Run issue #74 WinGNU static-link diagnostics"
      id: issue74
      continue-on-error: true
      shell: msys2 {0}
      env:
        MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        ISSUE74_NM: ${{ matrix.nm_tool }}
        ISSUE74_OBJDUMP: ${{ matrix.object_tool }}
      run: >-
        bash gui/.github/workflows/issue74/run_ucrt64_static_diagnostics.sh
        '${{ matrix.cc }}' ./v/v.exe gui issue74-artifacts '${{ matrix.lane }}'
    - name: Finalize bounded issue #74 evidence
      id: finalize_issue74
      if: ${{ always() }}
      continue-on-error: true
      shell: msys2 {0}
      run: |
        set -euo pipefail
        root="issue74-artifacts/${{ matrix.cc }}"
        test -d "$root" && test ! -L "$root"
        final_link_v1="$(cygpath -u "${ISSUE74_VERIFY_FINAL_LINK_V1:?}")"
        final_link_v3="$(cygpath -u "${ISSUE74_VERIFY_FINAL_LINK_V3:?}")"
        results_v1="$(cygpath -u "${ISSUE74_VERIFY_RESULTS_V1:?}")"
        results_v3="$(cygpath -u "${ISSUE74_VERIFY_RESULTS_V3:?}")"
        for helper in "$final_link_v1" "$final_link_v3" "$results_v1" "$results_v3"; do
          test -f "$helper" && test ! -L "$helper" && test -x "$helper"
        done
        validate_wer_leaf() {
          local leaf="$1"
          local suffix
          case "$leaf" in *[!A-Za-z0-9._-]*) return 1 ;; esac
          case "$leaf" in [0-9][0-9][0-9]_*) ;; *) return 1 ;; esac
          suffix="${leaf#????}"
          test -n "$suffix"
        }
        manifest_tmp="$(cygpath -u "$RUNNER_TEMP")/issue74-${{ matrix.lane }}-manifest.tmp"
        manifest="$root/manifest.sha256.tsv"
        meta="$root/manifest.meta"
        scan_artifacts() {
          local output_manifest="$1"
          local count=0
          local bytes=0
          local file relative size sha directory leaf wer_tail wer_leaf wer_payload
          : > "$output_manifest"
          if find "$root" -mindepth 1 -type l -print -quit | grep -q .; then
            echo 'Artifact tree contains a symlink' >&2; return 1
          fi
          if find "$root" -mindepth 1 ! -type f ! -type d -print -quit | grep -q .; then
            echo 'Artifact tree contains a non-regular object' >&2; return 1
          fi
          while IFS= read -r directory; do
            relative="${directory#"$root"/}"
            case "$relative" in
              logs|bin|pe|pkgconfig|pkgconfig/lib|pkgconfig/share|generated|probes|windows|windows/event-logs|windows/wer) ;;
              windows/wer/[0-9][0-9][0-9]_*)
                leaf="${relative#windows/wer/}"
                case "$leaf" in */*) echo "Nested WER artifact directory: $relative" >&2; return 1 ;; esac
                validate_wer_leaf "$leaf" || { echo "Invalid WER report component: $leaf" >&2; return 1; } ;;
              *) echo "Unknown artifact directory: $relative" >&2; return 1 ;;
            esac
          done < <(find "$root" -mindepth 1 -type d | LC_ALL=C sort)
          while IFS= read -r -d '' file; do
            test -f "$file" && test ! -L "$file"
            relative="${file#"$root"/}"
            case "$relative" in
              windows/wer/*/*)
                wer_tail="${relative#windows/wer/}"
                wer_leaf="${wer_tail%%/*}"
                wer_payload="${wer_tail#*/}"
                validate_wer_leaf "$wer_leaf" || { echo "Invalid WER report component: $wer_leaf" >&2; return 1; }
                case "$wer_payload" in */*|'') echo "Invalid WER payload depth: $relative" >&2; return 1 ;; esac
                case "$wer_payload" in Report.wer|*.xml|*.txt) ;; *) echo "Invalid WER payload: $relative" >&2; return 1 ;; esac
                ;;
            esac
            case "$relative" in
              *.dmp|*/*/*/*/*) echo "Rejected artifact: $relative" >&2; return 1 ;;
              logs/*|bin/*|pe/*|pkgconfig/lib/*.pc|pkgconfig/share/*.pc|pkgconfig/*.txt|generated/*|probes/*|windows/collection.txt|windows/status.txt|windows/event-logs/Application.txt|windows/event-logs/Microsoft-Windows-Windows_Defender_Operational.txt|windows/event-logs/Microsoft-Windows-CodeIntegrity_Operational.txt|windows/wer/manifest.txt|windows/wer/*/*|results.tsv|results-contract.txt|summary.md|environment.txt|.diagnostic-start) ;;
              *) echo "Unknown artifact: $relative" >&2; return 1 ;;
            esac
            size="$(stat -c '%s' "$file")"
            test "$size" -le 8388608
            sha="$(sha256sum "$file" | cut -d' ' -f1)"
            printf '%s\t%s\t%s\n' "$relative" "$size" "$sha" >> "$output_manifest"
            count=$((count + 1)); bytes=$((bytes + size))
          done < <(find "$root" -mindepth 1 -type f -print0)
          test "$count" -gt 0 && test "$bytes" -le 67108864
          scan_count="$count"
          scan_bytes="$bytes"
        }

        # Reject unsafe inputs before invoking any evidence parser.
        scan_artifacts "$manifest_tmp"
        evidence_rc=0
        contract_rc_v1=0
        contract_rc_v3=0
        contract_v1="$root/results-contract.v1.tmp"
        contract_v3="$root/results-contract.v3.tmp"
        stdout_v1="$root/results-contract.v1.stdout.tmp"
        stdout_v3="$root/results-contract.v3.stdout.tmp"
        stderr_v1="$root/results-contract.v1.stderr.tmp"
        stderr_v3="$root/results-contract.v3.stderr.tmp"
        "$results_v1" "$root/results.tsv" '${{ matrix.cc }}' "$contract_v1" \
          >"$stdout_v1" 2>"$stderr_v1" || contract_rc_v1=$?
        "$results_v3" "$root/results.tsv" '${{ matrix.cc }}' "$contract_v3" \
          >"$stdout_v3" 2>"$stderr_v3" || contract_rc_v3=$?
        contract_rc="$contract_rc_v1"
        contract_parity=0
        [ "$contract_rc_v1" -eq "$contract_rc_v3" ] || contract_parity=1
        report_pairs=()
        if [ -f "$contract_v1" ] && [ -f "$contract_v3" ]; then
          report_pairs=("$contract_v1" "$contract_v3")
        elif [ -e "$contract_v1" ] || [ -L "$contract_v1" ] || [ -e "$contract_v3" ] || [ -L "$contract_v3" ]; then
          contract_parity=1
        fi
        "$final_link_v1" compare-files "$stdout_v1" "$stdout_v3" "$stderr_v1" "$stderr_v3" \
          "${report_pairs[@]}" || contract_parity=1
        "$final_link_v3" compare-files "$stdout_v1" "$stdout_v3" "$stderr_v1" "$stderr_v3" \
          "${report_pairs[@]}" || contract_parity=1
        cat "$stdout_v1"
        cat "$stderr_v1" >&2
        if [ "$contract_parity" -eq 0 ] && [ "${#report_pairs[@]}" -eq 2 ]; then
          mv "$contract_v1" "$root/results-contract.txt"
          rm -f "$contract_v3"
        else
          contract_rc=1
        fi
        rm -f "$stdout_v1" "$stdout_v3" "$stderr_v1" "$stderr_v3" "$contract_v1" "$contract_v3"
        if [ "$contract_rc" -ne 0 ]; then
          evidence_rc=1
        fi
        if [ ! -f "$root/results-contract.txt" ]; then
          printf 'expected=unknown\nactual=unknown\ncomplete=false\nerror=verifier-exit-%s\n' \
            "$contract_rc" > "$root/results-contract.txt"
          evidence_rc=1
        fi
        event_root="$root/windows/event-logs"
        wer_manifest="$root/windows/wer/manifest.txt"
        event_log_files=0
        query_errors=0
        wer_count=unknown
        if [ -d "$event_root" ] && [ ! -L "$event_root" ] && [ -f "$wer_manifest" ]; then
          event_log_files="$(find "$event_root" -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [ "$event_log_files" -ne 3 ] || [ "$(grep -c '^matching_report_count=[0-9][0-9]*$' "$wer_manifest" || true)" -ne 1 ]; then
            evidence_rc=1
          fi
          wer_count="$(sed -n 's/^matching_report_count=//p' "$wer_manifest")"
          [ -n "$wer_count" ] || { wer_count=unknown; evidence_rc=1; }
        else
          evidence_rc=1
        fi
        if [ -d "$root/windows" ]; then
          query_errors="$( { grep -RhE 'Event log query failed:|root_query_failed=|report_read_failed=' \
            "$root/windows" 2>/dev/null || true; } | awk 'END {print NR + 0}')"
        else
          mkdir -p "$root/windows"
          evidence_rc=1
        fi
        printf 'event_log_files=%s\nquery_errors=%s\nwer_count=%s\n' \
          "$event_log_files" "$query_errors" "$wer_count" > "$root/windows/status.txt"

        # Re-scan all raw and derived evidence, then mark it safe for upload.
        scan_artifacts "$manifest_tmp"
        LC_ALL=C sort "$manifest_tmp" > "$manifest"
        rm "$manifest_tmp"
        manifest_sha="$(sha256sum "$manifest" | cut -d' ' -f1)"
        expected_results="$(sed -n 's/^expected=//p' "$root/results-contract.txt")"
        actual_results="$(sed -n 's/^actual=//p' "$root/results-contract.txt")"
        [ -n "$expected_results" ] || { expected_results=unknown; evidence_rc=1; }
        [ -n "$actual_results" ] || { actual_results=unknown; evidence_rc=1; }
        if [ ! -s "$root/results.tsv" ] || [ ! -s "$root/summary.md" ]; then
          evidence_rc=1
        fi
        evidence_complete=false
        [ "$evidence_rc" -eq 0 ] && evidence_complete=true
        printf 'artifact_safe=true\nevidence_complete=%s\nfiles=%s\nbytes=%s\nmanifest_sha256=%s\nexpected_results=%s\nactual_results=%s\nwer_query_errors=%s\ncontract_exit_code=%s\n' \
          "$evidence_complete" "$scan_count" "$scan_bytes" "$manifest_sha" "$expected_results" "$actual_results" "$query_errors" "$contract_rc" > "$meta"
        manifest_size="$(stat -c '%s' "$manifest")"
        meta_size="$(stat -c '%s' "$meta")"
        test "$manifest_size" -le 8388608 && test "$meta_size" -le 8388608
        test $((scan_bytes + manifest_size + meta_size)) -le 67108864
        github_output="$(cygpath -u "$GITHUB_OUTPUT")"
        echo 'artifact_safe=true' >> "$github_output"
        exit "$evidence_rc"
    - name: "Upload issue #74 diagnostic artifacts"
      id: upload_issue74
      if: ${{ always() && steps.finalize_issue74.outputs.artifact_safe == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: issue74-${{ matrix.lane }}-${{ github.run_attempt }}
        path: issue74-artifacts/${{ matrix.cc }}
        if-no-files-found: error
        retention-days: 90
    - name: "Enforce issue #74 required diagnostics"
      if: ${{ always() }}
      shell: msys2 {0}
      run: |
        if [ '${{ steps.issue74.outcome }}' != success ]; then
          echo "Required issue #74 diagnostics failed for ${{ matrix.cc }}." >&2
          exit 1
        fi
        if [ '${{ steps.finalize_issue74.outcome }}' != success ]; then
          echo "Issue #74 evidence finalizer failed for ${{ matrix.lane }}." >&2
          exit 1
        fi
        if [ '${{ steps.upload_issue74.outcome }}' != success ]; then
          echo "Issue #74 artifact upload failed for ${{ matrix.lane }}." >&2
          exit 1
        fi
    - name: Run Windows setup preflight
      shell: msys2 {0}
      env:
        GUI_WINDOWS_PREFLIGHT_CC: ${{ matrix.cc }}
      run: |
        export PATH="$PWD/v:$PATH"
        v run gui/_windows_preflight.vsh
    - name: Run noninteractive native tests
      if: ${{ matrix.cc == 'gcc' }}
      shell: msys2 {0}
      run: |
        export PATH="$PWD/v:$PATH"
        v -no-parallel -cc gcc test \
          gui/_native_dialog_test.v \
          gui/_native_print_test.v \
          gui/_native_notification_test.v \
          gui/nativebridge/_bridge_ex_test.v \
          gui/nativebridge/_readback_abi_test.v
    - name: Compile native smoke examples
      if: ${{ matrix.cc == 'gcc' }}
      shell: msys2 {0}
      run: |
        export PATH="$PWD/v:$PATH"
        v -no-parallel -cc gcc -W -o dialogs_smoke.exe gui/examples/dialogs.v
        v -no-parallel -cc gcc -W -o printing_smoke.exe gui/examples/printing.v
        v -no-parallel -cc gcc -W -o notification_smoke.exe gui/examples/native_notification.v
        if [ '${{ inputs.run_d3d11 }}' = 'true' ]; then
          for item in \
            'printing:gui/examples/printing.v:-W' \
            'gradient_demo:gui/examples/gradient_demo.v:-W' \
            'shadow_demo:gui/examples/shadow_demo.v:-W' \
            'blur_demo:gui/examples/blur_demo.v:-W' \
            'image_clip:gui/examples/image_clip.v:-W' \
            'svg_demo:gui/examples/svg_demo.v:-W' \
            'custom_shader:gui/examples/custom_shader.v:-W' \
            'showcase:gui/examples/showcase.v:'
          do
            IFS=':' read -r name path warn_flag <<< "$item"
            args=(-no-parallel -cc gcc -d sokol_d3d11)
            if [ -n "$warn_flag" ]; then
              args+=("$warn_flag")
            fi
            args+=(-o "${name}_d3d11_smoke.exe" "$path")
            v "${args[@]}"
            if [ "$?" -ne 0 ]; then
              exit 1
            fi
          done
        fi
