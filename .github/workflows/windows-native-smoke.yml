    - name: Validate existing vglyph checkout
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $vglyphPath = Join-Path $env:VMODULES 'vglyph'
        if (-not (Test-Path -LiteralPath $vglyphPath -PathType Container) -or
            -not (Test-Path -LiteralPath (Join-Path $vglyphPath '.git')) -or
            -not (Test-Path -LiteralPath (Join-Path $vglyphPath 'v.mod') -PathType Leaf)) {
