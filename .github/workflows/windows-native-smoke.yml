name: Windows Native Smoke

on:
  workflow_dispatch:
    inputs:
      prewarm_deps_only:
        description: "Install/cache MSVC vcpkg/vglyph dependencies only; skip tests and examples"
        type: boolean
        default: false
      run_mingw:
        description: "Run required UCRT64, CLANG64 and MINGW64 issue #74 static-link diagnostics"
        type: boolean
        default: true
      run_d3d11:
        description: "Also compile D3D11 probes; requires a V build with -d sokol_d3d11 support"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  V_REPOSITORY: https://github.com/GGRei/v.git
  V_REVISION: 42579b55a6e78bd684099b6508528e61fa8063d6
  VGLYPH_REPOSITORY: https://github.com/GGRei/vglyph.git
  VGLYPH_REVISION: 5e0d41e4f21468d3edf24c7365b284d74e9889db
  VMODULES: ${{ github.workspace }}\.vmodules
  VCPKG_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-binary-cache,readwrite
  VCPKG_CACHE_SCHEMA: gui-issue74-v1
  VCPKG_PACKAGES: freetype,pango,openssl
  VCPKG_TARGET_TRIPLET: x64-windows

jobs:
  prewarm-msvc-deps:
    name: Prewarm MSVC/vcpkg deps
    runs-on: windows-latest
    timeout-minutes: 90
    if: ${{ inputs.prewarm_deps_only }}
    steps:
    - name: Resolve V revision
      id: v
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $revision = '${{ env.V_REVISION }}'
        if ($revision -notmatch '^[0-9a-f]{40}$') {
          throw "V revision is not an exact 40-hex SHA: $revision"
        }
        Write-Host "V revision: $revision"
        "revision=$revision" | Add-Content -Path $env:GITHUB_OUTPUT
    - name: Restore V compiler cache
      id: restore-v-cache
      uses: actions/cache/restore@v4
      with:
        path: v
        key: windows-v-compiler-${{ steps.v.outputs.revision }}-v1
    - name: Install V
      id: install-v
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        function Assert-NativeCommand($Message) {
          if ($LASTEXITCODE -ne 0) {
            throw $Message
          }
        }
        $expectedRevision = '${{ steps.v.outputs.revision }}'
        if (Test-Path .\v\v.exe) {
          $cachedRevision = ( & git -C v rev-parse HEAD).Trim()
          Assert-NativeCommand "Could not inspect cached V revision"
          if ($cachedRevision -ne $expectedRevision) {
            Write-Host "Cached V revision $cachedRevision does not match expected $expectedRevision; rebuilding."
            Remove-Item -Recurse -Force .\v
          }
        }
        if (-not (Test-Path .\v\v.exe)) {
          if (Test-Path .\v) {
            Remove-Item -Recurse -Force .\v
          }
          git init v
          Assert-NativeCommand "git init failed"
          git -C v remote add origin '${{ env.V_REPOSITORY }}'
          Assert-NativeCommand "git remote add failed"
          git -C v fetch --depth 1 origin $expectedRevision
          Assert-NativeCommand "git fetch failed"
          git -C v checkout --detach FETCH_HEAD
          Assert-NativeCommand "git checkout failed"
          Push-Location v
          cmd /c makev.bat
          if ($LASTEXITCODE -ne 0) {
            throw "makev.bat failed"
          }
          Pop-Location
        }
        $vPath = (Resolve-Path .\v).Path
        Add-Content -Path $env:GITHUB_PATH -Value $vPath
        $version = ( & .\v\v.exe version).Trim()
        $revision = ( & git -C v rev-parse HEAD).Trim()
        Assert-NativeCommand "Could not inspect V revision"
        if ($revision -ne $expectedRevision) {
          throw "Installed V revision $revision does not match expected $expectedRevision"
        }
        Write-Host "Resolved V revision: $revision"
        "version=$version" | Add-Content -Path $env:GITHUB_OUTPUT
        "revision=$revision" | Add-Content -Path $env:GITHUB_OUTPUT
    - name: Log V version
      run: v version
    - name: Save V compiler cache
      if: ${{ steps.restore-v-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: v
        key: ${{ steps.restore-v-cache.outputs.cache-primary-key }}
    - name: Resolve vglyph revision
      id: vglyph
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $revision = '${{ env.VGLYPH_REVISION }}'
        if ($revision -notmatch '^[0-9a-f]{40}$') {
          throw "vglyph revision is not an exact 40-hex SHA: $revision"
        }
        Write-Host "vglyph revision: $revision"
        "revision=$revision" | Add-Content -Path $env:GITHUB_OUTPUT
    - name: Resolve vcpkg revision
      id: vcpkg
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $vcpkgExe = (Get-Command vcpkg -ErrorAction Stop).Source
        $vcpkgRoot = if ($env:VCPKG_ROOT) { $env:VCPKG_ROOT } else { Split-Path -Parent $vcpkgExe }
        $revision = (& git -C $vcpkgRoot rev-parse HEAD).Trim()
        if ($LASTEXITCODE -ne 0 -or $revision -notmatch '^[0-9a-f]{40}$') {
          throw "Could not resolve the vcpkg checkout revision at $vcpkgRoot"
        }
        $schema = '${{ env.VCPKG_CACHE_SCHEMA }}'
        $triplet = '${{ env.VCPKG_TARGET_TRIPLET }}'
        $packages = '${{ env.VCPKG_PACKAGES }}'
        if ($schema -notmatch '^[A-Za-z0-9._-]+$' -or $triplet -notmatch '^[A-Za-z0-9._-]+$' -or $packages -notmatch '^[a-z0-9+._-]+(?:,[a-z0-9+._-]+)*$') {
          throw 'Invalid vcpkg cache input'
        }
        $cacheInputs = "schema=$schema;triplet=$triplet;packages=$packages"
        $sha256 = [System.Security.Cryptography.SHA256]::Create()
        try {
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($cacheInputs)
          $inputsDigest = ([System.BitConverter]::ToString($sha256.ComputeHash($bytes))).Replace('-', '').ToLowerInvariant()
        } finally {
          $sha256.Dispose()
        }
        & $vcpkgExe version
        Write-Host "vcpkg revision: $revision"
        Write-Host "vcpkg cache inputs: $cacheInputs"
        Write-Host "vcpkg cache inputs SHA-256: $inputsDigest"
        "revision=$revision" | Add-Content -Path $env:GITHUB_OUTPUT
        "inputs_digest=$inputsDigest" | Add-Content -Path $env:GITHUB_OUTPUT
        "triplet=$triplet" | Add-Content -Path $env:GITHUB_OUTPUT
    - name: Restore vcpkg binary cache
      id: restore-vcpkg-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.VCPKG_BINARY_CACHE }}
        key: windows-vcpkg-${{ steps.vcpkg.outputs.triplet }}-${{ steps.vcpkg.outputs.revision }}-${{ steps.vcpkg.outputs.inputs_digest }}
        restore-keys: |
          windows-vcpkg-${{ steps.vcpkg.outputs.triplet }}-${{ steps.vcpkg.outputs.revision }}-
    - name: Restore V module cache
      uses: actions/cache@v4
      with:
        path: ${{ env.VMODULES }}\vglyph
        key: windows-vmodules-vglyph-${{ steps.install-v.outputs.revision }}-${{ steps.vglyph.outputs.revision }}-v2
        restore-keys: |
          windows-vmodules-vglyph-${{ steps.install-v.outputs.revision }}-
          windows-vmodules-vglyph-
    - name: Install pango, freetype, and OpenSSL
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        New-Item -ItemType Directory -Force -Path "$env:VCPKG_BINARY_CACHE" | Out-Null
        $triplet = '${{ env.VCPKG_TARGET_TRIPLET }}'
        $packageSpecs = @('${{ env.VCPKG_PACKAGES }}'.Split(',') | ForEach-Object { "$($_):$triplet" })
        vcpkg install @packageSpecs
        if ($LASTEXITCODE -ne 0) {
          throw "vcpkg install failed"
        }
    - name: Save vcpkg binary cache
      if: ${{ steps.restore-vcpkg-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: ${{ env.VCPKG_BINARY_CACHE }}
        key: ${{ steps.restore-vcpkg-cache.outputs.cache-primary-key }}
    - name: Expose vcpkg pkg-config paths
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $triplet = '${{ env.VCPKG_TARGET_TRIPLET }}'
        $vcpkgExe = (Get-Command vcpkg -ErrorAction Stop).Source
        $roots = @()
        if ($vcpkgExe) {
          $roots += Split-Path -Parent $vcpkgExe
        }
        if ($env:VCPKG_ROOT) {
          $roots += $env:VCPKG_ROOT
        }
        $vcpkgRoot = $null
        foreach ($root in ($roots | Select-Object -Unique)) {
          if (Test-Path (Join-Path $root "installed\$triplet")) {
            $vcpkgRoot = $root
            break
          }
        }
        if (-not $vcpkgRoot) {
          throw "Could not find vcpkg installed\$triplet from vcpkg.exe or VCPKG_ROOT"
        }
        $tripletRoot = Join-Path $vcpkgRoot "installed\$triplet"
        $pkgConfigDirs = @(
          (Join-Path $tripletRoot 'lib\pkgconfig'),
          (Join-Path $tripletRoot 'share\pkgconfig')
        ) | Where-Object { Test-Path $_ }
        if ($pkgConfigDirs.Count -eq 0) {
          throw "No pkgconfig directories found under $tripletRoot"
        }
        $pkgConfigPath = $pkgConfigDirs -join ';'
        "PKG_CONFIG_PATH=$pkgConfigPath" | Add-Content -Path $env:GITHUB_ENV
        $env:PKG_CONFIG_PATH = $pkgConfigPath
        $pathEntries = @()
        $binDir = Join-Path $tripletRoot 'bin'
        if (Test-Path $binDir) {
          $pathEntries += $binDir
        }
        $pkgconfDir = Join-Path $tripletRoot 'tools\pkgconf'
        if (Test-Path $pkgconfDir) {
          $pathEntries += $pkgconfDir
        }
        foreach ($entry in $pathEntries) {
          $entry | Add-Content -Path $env:GITHUB_PATH
        }
        if ($pathEntries.Count -gt 0) {
          $env:PATH = ($pathEntries + $env:PATH) -join ';'
        }
        if (-not (Get-Command pkg-config -ErrorAction SilentlyContinue)) {
          $pkgconf = Get-Command pkgconf -ErrorAction SilentlyContinue
          if ($pkgconf) {
            $shimDir = Join-Path $env:RUNNER_TEMP 'pkg-config-shim'
            New-Item -ItemType Directory -Force -Path $shimDir | Out-Null
            Set-Content -Path (Join-Path $shimDir 'pkg-config.cmd') -Encoding ascii -Value @(
              '@echo off',
              '"' + $pkgconf.Source + '" %*'
            )
            $shimDir | Add-Content -Path $env:GITHUB_PATH
            $env:PATH = "$shimDir;$env:PATH"
          }
        }
        $pkgConfig = Get-Command pkg-config -ErrorAction Stop
        & $pkgConfig.Source --exists freetype2 pango pangoft2
        if ($LASTEXITCODE -ne 0) {
          throw "pkg-config could not resolve freetype2 pango pangoft2"
        }
        & $pkgConfig.Source --exists openssl libssl libcrypto
        if ($LASTEXITCODE -ne 0) {
          throw "pkg-config could not resolve openssl libssl libcrypto"
        }
        $canonicalPkgConfigDir = [IO.Path]::GetFullPath((Join-Path $tripletRoot 'lib\pkgconfig')).TrimEnd('\')
        $canonicalPrefix = [IO.Path]::GetFullPath($tripletRoot).TrimEnd('\')
        foreach ($module in @('openssl', 'libssl', 'libcrypto')) {
          $pcFileDir = (& $pkgConfig.Source --variable=pcfiledir $module).Trim()
          if ($LASTEXITCODE -ne 0 -or [IO.Path]::GetFullPath($pcFileDir).TrimEnd('\') -ne $canonicalPkgConfigDir) {
            throw "$module escaped canonical pkg-config directory: $pcFileDir"
          }
          $prefix = (& $pkgConfig.Source --variable=prefix $module).Trim()
          if ($LASTEXITCODE -ne 0 -or [IO.Path]::GetFullPath($prefix).TrimEnd('\') -ne $canonicalPrefix) {
            throw "$module escaped canonical vcpkg prefix: $prefix"
          }
        }
        $opensslLibs = @(& $pkgConfig.Source --libs openssl) -join ' '
        if ($LASTEXITCODE -ne 0) {
          throw 'pkg-config --libs openssl failed'
        }
        $opensslTokens = @($opensslLibs -split '\s+' | Where-Object { $_ })
        if (($opensslTokens | Where-Object { $_ -ceq '-llibssl' }).Count -ne 1 -or
            ($opensslTokens | Where-Object { $_ -ceq '-llibcrypto' }).Count -ne 1 -or
            ($opensslTokens | Where-Object { $_ -ceq '-lssl' -or $_ -ceq '-lcrypto' }).Count -ne 0) {
          throw "unexpected OpenSSL linker tokens: $opensslLibs"
        }
        foreach ($leaf in @('libssl.lib', 'libcrypto.lib')) {
          $item = Get-Item -LiteralPath (Join-Path $tripletRoot "lib\$leaf") -Force -ErrorAction Stop
          if (-not $item.PSIsContainer -and ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -eq 0) {
            continue
          }
          throw "invalid OpenSSL library leaf: $($item.FullName)"
        }
    - name: Ensure vglyph revision
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        function Assert-NativeCommand($Message) {
          if ($LASTEXITCODE -ne 0) {
            throw $Message
          }
        }
        $expectedRevision = '${{ steps.vglyph.outputs.revision }}'
        $vglyphPath = Join-Path $env:VMODULES 'vglyph'
        if (Test-Path (Join-Path $vglyphPath '.git')) {
          $cachedRevision = (& git -C $vglyphPath rev-parse HEAD).Trim()
          Assert-NativeCommand "Could not inspect cached vglyph revision"
          if ($cachedRevision -ne $expectedRevision) {
            Write-Host "Cached vglyph revision $cachedRevision does not match expected $expectedRevision; rebuilding."
            Remove-Item -Recurse -Force $vglyphPath
          }
        } elseif (Test-Path $vglyphPath) {
          Remove-Item -Recurse -Force $vglyphPath
        }
        if (-not (Test-Path $vglyphPath)) {
          $vmodulesPath = Split-Path -Parent $vglyphPath
          New-Item -ItemType Directory -Force -Path $vmodulesPath | Out-Null
          git init $vglyphPath
          Assert-NativeCommand "git init vglyph failed"
          git -C $vglyphPath remote add origin '${{ env.VGLYPH_REPOSITORY }}'
          Assert-NativeCommand "git remote add vglyph failed"
          git -C $vglyphPath fetch --depth 1 origin $expectedRevision
          Assert-NativeCommand "git fetch vglyph failed"
          git -C $vglyphPath checkout --detach FETCH_HEAD
          Assert-NativeCommand "git checkout vglyph failed"
        }
        $resolvedRevision = (& git -C $vglyphPath rev-parse HEAD).Trim()
        Assert-NativeCommand "Could not inspect resolved vglyph revision"
        if ($resolvedRevision -ne $expectedRevision) {
          throw "Resolved vglyph revision $resolvedRevision does not match expected $expectedRevision"
        }
        Write-Host "Resolved vglyph revision: $resolvedRevision"

  msvc:
    name: MSVC native smoke
    runs-on: windows-latest
    timeout-minutes: 90
    if: ${{ !inputs.prewarm_deps_only }}
    steps:
    - name: Resolve V revision
