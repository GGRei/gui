              } catch {
                Write-Warning "ISSUE74_C_COLLECTION key=$key warning=$($_.Exception.Message)"
              }

              try {
                $peFiles = @(Get-ChildItem -LiteralPath $ownerTempItem.FullName -Recurse -File -Force | Where-Object { $_.Extension -ceq '.exe' })
                if (@($peFiles | Where-Object { ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 }).Count -ne 0) {
                  throw "Generated PE tree contains a reparse point"
                }
                $unexpectedPe = @($peFiles | Where-Object { -not [string]::Equals($_.FullName, $ownerExe, [StringComparison]::OrdinalIgnoreCase) })
                if ($unexpectedPe.Count -ne 0) { throw "Unexpected PE paths: $($unexpectedPe.FullName -join '; ')" }
                if ($peFiles.Count -ne 1) { throw "Expected exact owner PE, found $($peFiles.Count)" }
                $ownerExeItem = $peFiles[0]
                if ($ownerExeItem.Length -le 0 -or $ownerExeItem.Length -gt 67108864) { throw "Owner PE is not bounded: $ownerExe" }
